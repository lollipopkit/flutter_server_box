name: server_box
description: server status & toolbox app.
publish_to: "none"
version: 1.0.1538+1538

environment:
  sdk: ">=3.11.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Reading an OCI image layout and unpacking a rootfs — see
  # `lib/core/utils/oci_image.dart`. Direct because this code imports it: as a
  # transitive one it is whatever some other package happens to want, and a
  # tar reader deciding what a hard link is has already cost this app a
  # release.
  archive: ^4.1.0
  choice: ^2.3.2
  # SHA-256 of a certificate's DER form, for the BMC's pinned certificate.
  # `X509Certificate` only offers sha1 ready made.
  crypto: ^3.0.0
  dio: ^5.2.1
  pinenacl: ^0.6.0
  # ECDSA and RSA key generation for the in-app keygen. Ed25519 comes from
  # pinenacl; dartssh2 does the OpenSSH serialisation for all three. Already
  # here transitively through dartssh2 — named so the import is legal.
  pointycastle: ^4.0.0
  dynamic_color: ^2.1.0
  equatable: ^2.1.0
  easy_isolate: ^1.3.0
  extended_image: ^10.0.0
  file_picker: ^12.0.0
  flutter_gbk2utf8: ^1.0.1
  flutter_riverpod: ^3.3.1
  flutter_highlight: ^0.7.0
  flutter_displaymode: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.2.1
  fl_chart: ^1.2.0
  freezed_annotation: ^3.0.0
  get_it: ^9.0.5
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.18.0
  responsive_framework: ^1.5.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  # Direct, though `SqliteStore` lives in fl_lib: `hooks.user_defines` below is
  # only honoured for this package's own dependencies, and the Hive migration
  # opens the database from here too.
  sqlite3: ^3.5.1
  # Storage layer over the same encrypted connection: `NativeDatabase.opened`
  # takes the `sqlite3` Database this app already opens and keys itself, so
  # sqlite3mc and the build-hook bundling below are untouched.
  drift: ^2.34.3
  wakelock_plus: ^1.7.0
  wake_on_lan: ^4.1.1+3
  webdav_client_plus: ^2.0.0
  url_launcher: ^6.2.6
  dartssh2:
    path: packages/dartssh2
  circle_chart:
    path: packages/circle_chart
  icons_plus:
    git:
      url: https://github.com/lollipopkit/icons_plus
      ref: main
  xterm:
    path: packages/xterm
  # Extracted from this app — see `docs/principles/bmc.md`. A path dependency
  # like the other vendored packages; not on pub.dev while the API is moving.
  redfish:
    path: packages/redfish
  computer:
    git:
      url: https://github.com/lollipopkit/dart_computer
      ref: v1.0.88
  watch_connectivity:
    path: packages/watch_connectivity
  plain_notification_token:
    path: packages/plain_notification_token
  fl_lib:
    path: packages/fl_lib
  # Forked to swap five per-platform build integrations for one build hook,
  # which is what takes the last pod out of the iOS and macOS builds.
  flutter_pty:
    path: packages/flutter_pty
  flutter_rust_bridge: 2.13.0-beta.6
  # Drives the build hook below. `sbm_ffi` is no longer a Flutter plugin — the
  # hook compiles the crate directly, so there is nothing to depend on.
  flutter_rust_bridge_hooks: 2.13.0-beta.6
  desktop_drop: ^0.8.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_native_splash: ^2.1.6
  hive_ce_generator: ^1.11.0
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  # drift_dev 2.34.0 still calls DartPlaceholder.when(), removed by sqlparser
  # 0.44.6. Keep its companion parser at the last compatible release.
  sqlparser: 0.44.5
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.0
  freezed: ^3.0.0
  riverpod_generator: ^4.0.3
  test: ^1.29.0
  flutter_test:
    sdk: flutter
  fl_build:
    path: packages/fl_build

# Which SQLite gets compiled into the app. Only the root package can set this —
# a dependency cannot supply its own defaults — so it lives here even though
# every caller is in fl_lib.
#
# `sqlite3mc` rather than `sqlcipher`: both encrypt the whole file, keys and
# indexes included, but SQLCipher links OpenSSL on Windows, Linux and Android,
# where SQLite3MultipleCiphers carries its cipher implementations in its own
# source and needs nothing installed on any of the five platforms.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app_icon.png
    - assets/rootfs_manifest.json
    # The directory, not each file: `Dist.markAsset` names them by enum name.
    # Only distributions whose logo carries an explicit copyright licence are
    # in there — see the README beside them, which Flutter leaves out because
    # it only bundles files it can load.
    - assets/distro/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

flutter_native_splash:
  color: "#ffffff"
  image: assets/app_icon.png
  color_dark: "#121212"
  info_plist_files:
    - "ios/Runner/Info-Debug.plist"
    - "ios/Runner/Info-Profile.plist"
    - "ios/Runner/Info-Release.plist"
  android12: true

# What `fl_build` names the artifacts it produces, and the `BuildData.name` it
# generates — which is the name the app itself draws. Here rather than in an
# `fl_build.json` of its own, which is a file for one key. CI reads this same
# line, so the name it publishes assets under cannot drift from the name the
# build gave them.
fl_build:
  appName: ServerBox
