version: 2
updates:
  # Rust workspace (monitor + shared crates + FFI)
  - package-ecosystem: cargo
    directories:
      - "/monitor"
      - "/crates/sbm_parser"
      - "/crates/sbm_ffi"
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns:
          - "*"

  # monitor web frontend
  - package-ecosystem: npm
    directory: "/monitor/frontend"
    schedule:
      interval: weekly
    groups:
      frontend-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
