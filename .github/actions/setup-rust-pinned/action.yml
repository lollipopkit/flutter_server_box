name: Install the pinned Rust toolchain
description: >-
  The toolchain the app's build hook is pinned to (crates/sbm_ffi/rust-toolchain.toml),
  rather than the runner's `stable`, which moves on its own: a lint added in a
  new release failed pull requests that changed nothing it looks at. Sets
  RUSTUP_TOOLCHAIN for the rest of the job.
runs:
  using: composite
  steps:
    # Hosted Windows runners check out with `core.autocrlf=true`, so the CR is
    # stripped before the `$`-anchored match; an empty result fails here
    # instead of as a confusing `rustup` error.
    - name: Install the pinned Rust toolchain
      shell: bash
      run: |
        v="$(tr -d '\r' < crates/sbm_ffi/rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
        test -n "$v" || { echo "no channel in crates/sbm_ffi/rust-toolchain.toml" >&2; exit 1; }
        rustup toolchain install "$v" --profile minimal -c clippy --no-self-update
        echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"
