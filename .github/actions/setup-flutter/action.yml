name: Set up Flutter
description: The Flutter this project is built with, in the one place that says so.

# Which Flutter CI uses was an `env: FLUTTER_VERSION` in every workflow that
# needed one, read by ten copies of the same four-line step. Bumping it meant
# finding all of them, and a workflow left behind built the app on a different
# SDK than the one it ships from — which is the kind of difference that shows
# up as a failure somewhere else entirely.
#
# A composite action rather than a version file the setup action can read:
# those are `.fvmrc`, `fvm_config.json`, or `pubspec.yaml`'s
# `environment.flutter`. This project does not use FVM, and that pubspec field
# is a *constraint* — pinning it to one version to satisfy CI would refuse to
# build for anybody on a newer stable.
#
# Requires the repository to be checked out first, which every job that sets
# Flutter up already does.
#
# `cache: true` keeps the SDK and the pub cache between runs, restored at the
# start and saved by a second call with `step: save` once `pub get` has run.
# Not the setup action's own `cache`: its save cannot be turned off, and a
# pull request would add its own to the repository's 10 GB; here, as for the
# build hook cache, only main saves.
inputs:
  cache:
    description: "Restore the SDK and pub cache, and save them with `step: save`"
    required: false
    default: "false"
  step:
    description: "`restore` to set Flutter up, `save` to save the caches after it"
    required: false
    default: restore

runs:
  using: composite
  steps:
    # Read from the install step below, which is the one place the version is
    # said: `scripts/release/android-build-env.sh` (the release and F-Droid
    # builds) reads that same line, and a second copy of it would be two
    # answers to that read.
    - name: Read the Flutter version
      shell: bash
      run: |
        version="$(sed -n -E \
          's/^[[:space:]]*flutter-version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' \
          "$GITHUB_ACTION_PATH/action.yml" | tr -d "\"'")"
        [ -n "$version" ] || { echo "no flutter-version in $GITHUB_ACTION_PATH/action.yml" >&2; exit 1; }
        echo "SBM_FLUTTER_VERSION=$version" >> "$GITHUB_ENV"

    # Where the SDK and pub cache go, and their keys, without installing.
    - id: where
      if: inputs.cache == 'true'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: ${{ env.SBM_FLUTTER_VERSION }}
        dry-run: true

    - name: Restore the Flutter SDK
      if: inputs.cache == 'true' && inputs.step == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.CACHE-PATH }}
        key: ${{ steps.where.outputs.CACHE-KEY }}

    - name: Restore the pub cache
      if: inputs.cache == 'true' && inputs.step == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.where.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: ${{ steps.where.outputs.PUB-CACHE-KEY }}-

    # Skips the download when the SDK was restored above.
    - if: inputs.step == 'restore'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: stable
        flutter-version: 3.47.8

    # After the job has used it, so what `flutter` downloads on first use
    # (engine artifacts, the Dart SDK) is in it too. A key that already exists
    # is a warning, not a failure.
    - name: Save the Flutter SDK
      if: inputs.cache == 'true' && inputs.step == 'save' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.CACHE-PATH }}
        key: ${{ steps.where.outputs.CACHE-KEY }}

    - name: Save the pub cache
      if: inputs.cache == 'true' && inputs.step == 'save' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.where.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.where.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
