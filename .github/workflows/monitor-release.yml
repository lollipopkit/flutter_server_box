name: Monitor Release

# Manual trigger only. Versioning is decoupled from the app: no git tags are read;
# the monitor crate version (monitor/Cargo.toml) is authoritative.
# The release tag is monitor-v<version>, independent of the app's v1.0.x.
#
# Artifacts:
# - Native binaries (Linux musl / macOS / Windows) → GitHub Release
# - Docker image (Alpine, reusing the Linux musl binary without in-image builds) → ghcr.io
on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Allow overwriting an existing monitor-v* release tag / ghcr.io tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/server-box-monitor
  BIN_NAME: server-box-monitor

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: monitor-v${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read crate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "server_box_monitor") | .version')"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Failed to read server_box_monitor version from Cargo metadata."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Monitor version: $version"

      - name: Refuse to overwrite published release tag
        if: inputs.overwrite != true
        shell: bash
        run: |
          set -euo pipefail
          tag="monitor-v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists."
            echo "Bump the version in monitor/Cargo.toml, or re-run with overwrite=true."
            exit 1
          fi

  frontend:
    name: Build frontend
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: monitor/frontend/package-lock.json

      - name: Build
        working-directory: monitor/frontend
        run: |
          npm ci
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monitor-frontend-dist
          path: monitor/frontend/dist
          if-no-files-found: error
          retention-days: 3

  native:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [meta, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install musl toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build -p server_box_monitor --release --target ${{ matrix.target }}

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monitor-frontend-dist
          path: monitor/frontend/dist

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          bin=server_box_monitor
          ext=""
          if [[ "${{ matrix.platform }}" == "windows" ]]; then ext=".exe"; fi

          staging="${BIN_NAME}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${bin}${ext}" "$staging/"
          mkdir -p "$staging/frontend"
          cp -r monitor/frontend/dist "$staging/frontend/dist"
          cp -r monitor/migrations "$staging/migrations"
          cp monitor/config.example.toml monitor/.env.example "$staging/"

          name="${BIN_NAME}_v${version}_${{ matrix.platform }}_${{ matrix.arch }}"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            # 7-Zip, preinstalled on the runner, and not `tar -a`. `shell:
            # bash` on windows-latest is Git Bash, whose `tar` is GNU tar —
            # whose --auto-compress knows .gz/.bz2/.xz/.zst and cannot produce
            # a zip at all. Handed a suffix it does not know it silently writes
            # a plain uncompressed tar under that name, which is what v0.1.0
            # shipped: 26MB rather than ~10MB, and a file Explorer and
            # `Expand-Archive` both refuse for having no PK signature.
            7z a -tzip "${name}.zip" "$staging" > /dev/null

            # The suffix is the only thing a consumer reads before opening it,
            # so it is checked here rather than found by someone downloading
            # the result. Two bytes, because that is exactly what said the old
            # one was wrong.
            if [[ "$(head -c 2 "${name}.zip")" != "PK" ]]; then
              echo "${name}.zip is not a zip archive."
              exit 1
            fi
          else
            tar -czf "${name}.tar.gz" "$staging"
          fi

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monitor-pkg-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 3

      # The Linux musl binary is reused in the Docker image, avoiding a second build
      - name: Upload raw bin for Docker
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: monitor-bin-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/server_box_monitor
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Publish image to ghcr.io
    needs: [meta, frontend, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: monitor-frontend-dist
          path: monitor/frontend/dist

      - name: Download linux bins
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: monitor-bin-linux-*
          path: dist/bins

      - name: Arrange Docker context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker/amd64 dist/docker/arm64
          mv dist/bins/monitor-bin-linux-amd64/server_box_monitor dist/docker/amd64/
          mv dist/bins/monitor-bin-linux-arm64/server_box_monitor dist/docker/arm64/

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite published version
        if: inputs.overwrite != true
        shell: bash
        run: |
          set -euo pipefail
          tag="${IMAGE}:${{ needs.meta.outputs.version }}"
          if docker manifest inspect "$tag" > /dev/null 2>&1; then
            echo "$tag already exists on ghcr.io."
            echo "Bump the version in monitor/Cargo.toml, or re-run with overwrite=true."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # COPY prebuilt artifacts only; multi-arch images without QEMU
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: monitor/Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=server-box-monitor
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: Create GitHub Release
    needs: [meta, native, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: monitor-pkg-*
          path: packages
          merge-multiple: true

      - name: Checksums
        shell: bash
        working-directory: packages
        # `--`, so an archive is never read as an option. The names are all
        # `server-box-monitor_…` today, which is the kind of thing that holds
        # until it doesn't; it keeps the bare filenames `sha256sum -c` expects.
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Monitor ${{ needs.meta.outputs.tag }}
          # Never the repository's latest release. That slot belongs to the
          # app, which is versioned separately — the whole point of this
          # workflow reading the crate version instead of a git tag. v0.1.0
          # took it, so anyone opening /releases/latest was handed the agent
          # rather than ServerBox.
          make_latest: false
          body: |
            The **ServerBox Monitor** agent, versioned independently of the
            app — see `monitor/README.md` for what it does and
            `config.example.toml` in the archive for how it is configured.

            ### Docker

            ```sh
            docker run -d --name server-box-monitor \
              -p 3770:3770 -v ./data:/data \
              ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
            ```

            Also tagged `latest`. `linux/amd64` and `linux/arm64`.

            ### Native

            Pick the archive for the machine being monitored and unpack it.
            Linux builds are static musl binaries, so they run on Alpine as
            they are. Each archive carries the binary, the web panel, the
            migrations and an example config.

            Verify what you downloaded against `SHA256SUMS`:

            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            ```
          files: |
            packages/*.tar.gz
            packages/*.zip
            packages/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
