name: flutter analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  reproducibilityCheck:
    name: Reproducibility check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Check Android split-build reproducibility
        shell: bash
        run: |
          grep_status=0
          git grep -n -F 'BuildConfig.VERSION_CODE' -- android/app/src/main || grep_status=$?
          if [[ "$grep_status" -eq 0 ]]; then
            echo "::error::BuildConfig.VERSION_CODE is ABI-specific for split APKs and must not be compiled into shared Android bytecode."
            exit 1
          elif [[ "$grep_status" -ne 1 ]]; then
            echo "::error::git grep failed with status ${grep_status}."
            exit "$grep_status"
          fi

      - name: Check locked dependencies
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Check JNI build-id patch
        run: scripts/release/patch-jni-build-id.sh

  rustTests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        run: cargo test --workspace --no-fail-fast

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze lib test

      - uses: Swatinem/rust-cache@v2

      # FFI-dependent suites (frb_parser/windows/server_status_update_req...)
      # load the dylib from target/debug via test/rust_lib_helper.dart
      - name: Build native FFI library
        run: cargo build -p sbm_ffi

      - name: Run tests
        run: flutter test
