# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: flutter analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  # For the `changes` job's file list. Read-only, and only for this repo.
  pull-requests: read

jobs:
  # Which of the expensive jobs this diff can actually affect.
  #
  # The two that cost real time are `iOS Linux engine` (~9 min: brews an LLVM
  # toolchain, builds the guest engine, then builds the app twice) and `Rust
  # tests (windows-latest)` (~7-9 min, most of it a cold compile). A docs-only
  # or Dart-only PR paid both for nothing.
  #
  # Asks GitHub for the file list rather than diffing refs: no checkout, no
  # fetch depth to get wrong, and no merge-base to compute against a base
  # branch that may have moved since. A pull request has one of its own; a push
  # is the range it pushed.
  #
  # On a push to main every filter answers "everything" — that is the ref
  # releases are cut from, and narrowing what runs there trades away the wrong
  # thing. `macos` is the one exception, and is answered honestly on both: 45
  # minutes on a macOS runner for a diff that cannot reach the macOS product is
  # not belt-and-braces, it is only the queue.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ish: ${{ steps.filter.outputs.ish }}
      macos: ${{ steps.filter.outputs.macos }}
      dart: ${{ steps.filter.outputs.dart }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      website: ${{ steps.filter.outputs.website }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Which filters are answered from the diff. Everything, on a pull
          # request; on anything else only the ones named here, and the rest
          # run unconditionally.
          strict=' rust ish macos dart frontend docs website '

          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            files="$(gh api --paginate \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --jq '.[].filename')"
          else
            strict=' macos '
            base='${{ github.event.before }}'
            # A branch's first push has no `before` to compare against, and a
            # force-push leaves one that is no longer an ancestor. Either way
            # there is no diff to be had, so nothing is narrowed.
            if [[ "$base" =~ ^0*$ ]] || ! files="$(gh api --paginate \
              "repos/${{ github.repository }}/compare/$base...${{ github.sha }}" \
              --jq '.files[].filename')"; then
              strict=''
              files=''
              echo "no diff to read: running everything"
            fi
          fi
          echo "changed files:"
          echo "$files"

          emit() {
            if [[ "$strict" != *" $1 "* ]]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              return
            fi
            if grep -qE "$2" <<< "$files"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "::notice::skipping the $1 jobs: nothing they cover changed"
            fi
          }

          # Patterns are grep -E against whole paths. A change to this workflow
          # turns everything on — the filters are the thing under test then —
          # and `packages/` are the submodules the app is built from, so a
          # gitlink move there is a source change to all of it.
          shared='^\.github/workflows/analysis\.yml$|^pubspec\.(yaml|lock)$|^packages/'

          emit rust "$shared|^crates/|^monitor/|^Cargo\.(toml|lock)$"
          # The engine, the scripts that build and check it, and everything the
          # iOS app links: this is the only job that compiles either the engine
          # or `flutter build ios` at all
          emit ish "$shared|^third_party/|^scripts/(build-ish-ios|check-ish-linkage)\.sh$|^ios/|^crates/sbm_ffi/"
          # The Xcode project and the entitlements, plus everything that is
          # compiled into the product: `hook/build.dart` is what builds the Rust
          # library into the app, and nothing else in CI links it on macOS.
          #
          # `lib/` is deliberately absent. `check` runs `flutter analyze` and
          # `flutter test` on every Dart change, so a change there that would
          # fail to compile fails there first, minutes earlier and on a cheaper
          # runner. What only a macOS runner can answer is whether the project
          # and the Rust static library still link.
          emit macos "$shared|^macos/|^hook/|^crates/|^Cargo\.(toml|lock)$"
          # `crates/` because `flutter test` loads the FFI dylib and the
          # generated bindings come from there.
          #
          # `macos/` because `test/macos_entitlements_test.dart` is a plain
          # test and runs here — the `macOS build` job below says exactly that
          # and then relies on it. Without this, a change to an entitlements
          # file ran the 45-minute build and skipped the one test guarding what
          # it changed.
          emit dart "$shared|^lib/|^test/|^integration_test/|^crates/|^macos/|^Cargo\.(toml|lock)$|^analysis_options\.yaml$"
          emit frontend "$shared|^monitor/frontend/|^packages/webui/"
          emit docs "$shared|^docs/"
          emit website "$shared|^website/|^packages/webui/"

  reproducibilityCheck:
    name: Reproducibility check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Check Android split-build reproducibility
        shell: bash
        run: |
          grep_status=0
          git grep -n -F 'BuildConfig.VERSION_CODE' -- android/app/src/main || grep_status=$?
          if [[ "$grep_status" -eq 0 ]]; then
            echo "::error::BuildConfig.VERSION_CODE is ABI-specific for split APKs and must not be compiled into shared Android bytecode."
            exit 1
          elif [[ "$grep_status" -ne 1 ]]; then
            echo "::error::git grep failed with status ${grep_status}."
            exit "$grep_status"
          fi

      - name: Check locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Check JNI build-id patch
        run: scripts/release/patch-jni-build-id.sh

  rustTests:
    name: Rust tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test Rust workspace
        run: cargo test --workspace --no-fail-fast

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  monitorFrontend:
    name: Monitor frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: monitor/frontend/package-lock.json
      - name: Install dependencies
        working-directory: monitor/frontend
        run: |
          npm ci
          npm ci --prefix ../../packages/webui
      - name: Test, lint, check and build
        working-directory: monitor/frontend
        run: |
          npm exec vitest -- run
          npm run lint
          npm run check
          npm run build

  docs:
    name: Documentation site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install and build
        working-directory: docs
        run: |
          npm install
          npm run build

  website:
    name: Project website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install and build
        working-directory: website
        run: |
          npm install
          npm run build

  # The one path nothing else in CI compiles. `Build ios` in build.yml ships
  # SBM_ISH = 0, so with the switch off the engine is never fed to a compiler
  # and `sbm_ish.c` is only ever built as stubs — a change that breaks the real
  # thing would reach a phone before it reached anyone's attention.
  #
  # Both settings, because each one has already failed in a way the other could
  # not show: with the switch on, the linker once dead-stripped the whole engine
  # and produced a 58 KB binary; with it off, the documented check for a clean
  # strip turned out to pass on a binary that still had the engine in it.
  ishEngine:
    name: iOS Linux engine
    needs: changes
    if: needs.changes.outputs.ish == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      # meson and ninja build the engine; llvm because the guest VDSO targets
      # Linux, which Apple's clang cannot; lld because Homebrew ships it apart
      # from llvm and that is the linker the VDSO asks for by name; libarchive
      # because fakefsify links it.
      - name: Install the engine's build tools
        run: brew install meson ninja llvm lld libarchive

      - name: Install dependencies
        run: flutter pub get

      - name: Build the engine
        run: scripts/build-ish-ios.sh device

      # In an untracked local override, which is where a developer puts it too —
      # the tracked Ish.xcconfig stays at 0 so that an accidental release build
      # is one without the engine rather than one with it.
      - name: Build the app with the engine linked
        shell: bash
        run: |
          echo 'SBM_ISH = 1' > ios/Flutter/IshLocal.xcconfig
          flutter build ios --release --no-codesign

      - name: The engine is in the binary
        run: scripts/check-ish-linkage.sh build/ios/iphoneos/Runner.app/Runner on

      - name: And the switch takes it out again
        shell: bash
        run: |
          rm ios/Flutter/IshLocal.xcconfig
          flutter build ios --release --no-codesign
          scripts/check-ish-linkage.sh build/ios/iphoneos/Runner.app/Runner off

  # That the unsandboxed macOS product still builds, entitlements and all.
  #
  # It was written to run `integration_test` on a macOS device — the questions
  # only a running app can answer: where this build's data goes, whether the
  # keychain hands over the box key, whether `defaults` reads the other build's
  # preferences. It never once passed. A hosted runner has no session for the
  # app's output to be read from, so every file fails at load with "The log
  # reader stopped unexpectedly, or never started", and the launch itself hits
  # flutter/flutter#176850 ("Failed to foreground app; open returned 1"), which
  # is open and reproduces on ordinary desktops too.
  #
  # So this builds instead of pretending to test. The entitlements the products
  # ship with are guarded by `test/macos_entitlements_test.dart`, which is a
  # plain test and runs in `check` below; what is left for a macOS runner is
  # whether the project and the Rust static library still link.  The
  # running-app half needs a machine, and has nowhere in CI to run.
  #
  # This was a workflow of its own until it moved here, because `paths:` is a
  # workflow-level filter and "only when macos/** changed" had nowhere else to
  # live. The `changes` job above is that filter, per job, so it does now.
  macosBuild:
    name: macOS build
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install dependencies
        run: flutter pub get

      # No signing identity here, and none needed: the app is signed ad-hoc so
      # it can run at all. The entitlements go with it — trimmed to the ones
      # that do not need a provisioning profile, keeping the only one these
      # tests are about.
      - name: Sign locally
        run: |
          set -euo pipefail
          project=macos/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = BA88US33G6;/DEVELOPMENT_TEAM = "";/' \
            "$project"
          cat > macos/Runner/DebugProfile.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.security.app-sandbox</key>
          	<false/>
          	<key>com.apple.security.cs.allow-jit</key>
          	<true/>
          	<key>com.apple.security.network.client</key>
          	<true/>
          	<key>com.apple.security.network.server</key>
          	<true/>
          	<key>com.apple.security.files.user-selected.read-write</key>
          	<true/>
          </dict>
          </plist>
          EOF

      # `test/macos_entitlements_test.dart` is what guards the entitlements the
      # products actually ship with; it runs in `check`, on a checkout the step
      # above has not rewritten.
      - name: Build the unsandboxed app
        run: flutter build macos --debug

  check:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      
      - uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      # `integration_test` too: nothing else in CI reads that directory — the
      # suites in it need a device — so without this a change there is unseen
      # until somebody runs it by hand on one.
      - name: Analyze project source
        run: flutter analyze lib test integration_test

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # FFI-dependent suites (frb_parser/windows/server_status_update_req...)
      # load the dylib from target/debug via test/rust_lib_helper.dart
      - name: Build native FFI library
        run: cargo build -p sbm_ffi

      - name: Run tests
        run: flutter test
