name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release from the selected v1.0.<build> tag'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: ServerBox
  BUILD_TAG: test-build-${{ github.run_number }}-${{ github.sha }}
  FLUTTER_VERSION: "3.47.0"

jobs:
  reproducibilityCheck:
    name: Reproducibility check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Require tagged releases
        if: inputs.release == true && github.ref_type != 'tag'
        shell: bash
        run: |
          echo "Release builds must be started from a committed tag so the source can be reproduced by downstream builders."
          echo "Create and push a v1.0.<build> tag after committing the release version files."
          exit 1
      - name: Check tag source version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          expected="${GITHUB_REF_NAME#v}"
          build="${expected##*.}"
          pub_version="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1+\2/p' pubspec.yaml | head -n 1)"
          build_data="$(sed -n -E 's/.*static const int build = ([0-9]+);/\1/p' lib/data/res/build_data.dart | head -n 1)"

          if [[ "$pub_version" != "$expected+$build" ]]; then
            echo "pubspec.yaml version must match tag ${GITHUB_REF_NAME}; got ${pub_version}."
            exit 1
          fi

          if [[ "$build_data" != "$build" ]]; then
            echo "BuildData.build must match tag ${GITHUB_REF_NAME}; got ${build_data}."
            exit 1
          fi
      - name: Check locked dependencies
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Check JNI build-id patch
        shell: bash
        run: scripts/release/patch-jni-build-id.sh

  verifyMacOS:
    name: Verify macOS release
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    needs: reproducibilityCheck
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: flutter pub get
      - name: Sign locally
        shell: bash
        run: |
          set -euo pipefail
          project=macos/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
            -e 's/"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "3rd Party Mac Developer Application";/"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = BA88US33G6;/DEVELOPMENT_TEAM = "";/' \
            -e 's/"DEVELOPMENT_TEAM\[sdk=macosx\*\]" = BA88US33G6;/"DEVELOPMENT_TEAM[sdk=macosx*]" = "";/' \
            "$project"
          cat > macos/Runner/Release.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <false/>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.network.server</key>
            <true/>
            <key>com.apple.security.files.user-selected.read-write</key>
            <true/>
          </dict>
          </plist>
          EOF
      - name: Build release
        run: flutter build macos --release
      - name: Verify release launch
        shell: bash
        run: |
          set -euo pipefail
          app="build/macos/Build/Products/Release/Server Box.app"
          executable="$app/Contents/MacOS/Server Box"
          log_file="$RUNNER_TEMP/server-box.log"

          codesign --verify --deep --strict "$app"
          "$executable" >"$log_file" 2>&1 &
          pid=$!

          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
              wait "$pid" || true
            fi
          }
          trap cleanup EXIT

          for _ in {1..10}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              cat "$log_file"
              log show --last 2m --style compact --predicate 'process == "Server Box"' || true
              echo "Server Box exited before the macOS launch smoke test completed."
              exit 1
            fi
            sleep 1
          done

          cat "$log_file"

  verifyMonitor:
    name: Verify monitor ${{ matrix.platform }}-${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.release != true
    needs: reproducibilityCheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux
            arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install musl toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build -p server_box_monitor --release --target ${{ matrix.target }}

  buildAndroid:
    name: Build android
    needs: reproducibilityCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Fetch secrets
        run: |
          curl --fail --show-error --location -u ${{ secrets.BASIC_AUTH }} -o android/app/app.key ${{ secrets.URL_PREFIX }}app.key
          curl --fail --show-error --location -u ${{ secrets.BASIC_AUTH }} -o android/key.properties ${{ secrets.URL_PREFIX }}key.properties
      - name: Patch JNI build-id
        run: |
          flutter pub get
          scripts/release/patch-jni-build-id.sh
      # The Linux userland the terminal tab offers. Not in the repository —
      # these are binaries, and they are built from pinned upstream sources
      # here. Without this step the feature is absent from the build rather
      # than broken in it, which is why the check below exists.
      - name: Build proot
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          scripts/build-proot-android.sh
      - name: Build (release)
        if: inputs.release == true || github.ref_type == 'tag'
        shell: bash
        run: dart run fl_build -bp -p android
      - name: Build (test)
        if: inputs.release != true && github.ref_type != 'tag'
        shell: bash
        run: dart run fl_build -p android
      # `useLegacyPackaging` off means nothing is extracted from the APK, so
      # `nativeLibraryDir` does not exist and proot cannot be run from
      # anywhere. The APK still builds, installs and runs — the rootfs entry
      # simply never appears. Checked here because nothing else would say so.
      - name: Check proot shipped
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*_arm64.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "no arm64 APK was built"; exit 1; }
          for apk in "${apks[@]}"; do
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libproot.so' ||
              { echo "$apk carries no proot; the Linux userland would be missing"; exit 1; }
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libproot-loader.so' ||
              { echo "$apk carries proot but not its loader; entering the rootfs would be refused"; exit 1; }
          done
      - name: Rename
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          for f in *_${BUILD_NUMBER}_*.apk; do
            mv "$f" "${f/_${BUILD_NUMBER}_/_v1.0.${BUILD_NUMBER}_}"
          done
          # Remove original APKs copied by fl_build
          rm -f app-*-release.apk
      - name: Upload artifacts
        if: inputs.release != true && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Create Release
        if: inputs.release == true || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          files: |
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}_arm64.apk
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}_arm.apk
            build/app/outputs/flutter-apk/${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}_amd64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  buildIOS:
    name: Build ios
    needs: reproducibilityCheck
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Resolve build number
        shell: bash
        run: |
          set -euo pipefail

          build="$(sed -n -E 's/.*static const int build = ([0-9]+);/\1/p' lib/data/res/build_data.dart | head -n 1)"
          if [[ -z "$build" ]]; then
            echo "BuildData.build not found in lib/data/res/build_data.dart"
            exit 1
          fi

          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
      - name: Build (unsigned)
        shell: bash
        run: |
          flutter build ios --release --no-codesign \
            --build-number="${BUILD_NUMBER}" \
            --build-name="1.0.${BUILD_NUMBER}"
      - name: Package ipa
        shell: bash
        run: APP_ASSET_NAME="${APP_NAME}" scripts/release/package-unsigned-ipa.sh
      - name: Upload artifacts
        if: inputs.release != true && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-ios
          path: build/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Create Release
        if: inputs.release == true || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          files: |
            build/artifacts/${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}_NoSign.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  buildLinux:
    name: Build linux
    needs: reproducibilityCheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            release_suffix: ""
            artifact_suffix: ""
          - runs_on: ubuntu-22.04
            release_suffix: "_legacy"
            artifact_suffix: "-legacy"
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev mesa-utils libvulkan-dev desktop-file-utils wget
          sudo apt install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libunwind-dev libsecret-1-dev
      - name: Build (release)
        if: inputs.release == true || github.ref_type == 'tag'
        shell: bash
        run: dart run fl_build -bp -p linux
      - name: Build (test)
        if: inputs.release != true && github.ref_type != 'tag'
        shell: bash
        run: dart run fl_build -p linux
      - name: Rename
        shell: bash
        run: |
          for f in *_${BUILD_NUMBER}_*.AppImage; do
            mv "$f" "${f/_${BUILD_NUMBER}_/_v1.0.${BUILD_NUMBER}_}"
          done
      - name: Add legacy suffix
        if: matrix.release_suffix != ''
        shell: bash
        run: |
          mv "${APP_NAME}_v1.0.${BUILD_NUMBER}_amd64.AppImage" "${APP_NAME}_v1.0.${BUILD_NUMBER}${{ matrix.release_suffix }}_amd64.AppImage"
      - name: Upload artifacts
        if: inputs.release != true && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-linux${{ matrix.artifact_suffix }}
          path: "*.AppImage"
          if-no-files-found: error
          retention-days: 14
      - name: Create Release
        if: inputs.release == true || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          files: |
            ${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}${{ matrix.release_suffix }}_amd64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  buildWindows:
    name: Build windows
    needs: reproducibilityCheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Build (release)
        if: inputs.release == true || github.ref_type == 'tag'
        shell: bash
        run: dart run fl_build -bp -p windows
      - name: Build (test)
        if: inputs.release != true && github.ref_type != 'tag'
        shell: bash
        run: dart run fl_build -p windows
      - name: Rename
        shell: bash
        run: |
          for f in *_${BUILD_NUMBER}_*.zip; do
            mv "$f" "${f/_${BUILD_NUMBER}_/_v1.0.${BUILD_NUMBER}_}"
          done
      - name: Upload artifacts
        if: inputs.release != true && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-windows
          path: "*_windows_amd64.zip"
          if-no-files-found: error
          retention-days: 14
      - name: Create Release
        if: inputs.release == true || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          files: |
            ${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}_windows_amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
