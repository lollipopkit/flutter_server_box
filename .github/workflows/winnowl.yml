name: winnowl

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: lollipopkit/winnowl@af74a8a95025711e926d910cd2e6d1c6edced437 # main
        with:
          llm-api-key: ${{ secrets.WINNOWL_LLM_API_KEY }}
          llm-base-url: ${{ secrets.WINNOWL_LLM_BASE_URL }}
