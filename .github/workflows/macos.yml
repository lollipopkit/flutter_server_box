# That the unsandboxed macOS product still builds, entitlements and all.
#
# It was written to run `integration_test` on a macOS device — the questions
# only a running app can answer: where this build's data goes, whether the
# keychain hands over the box key, whether `defaults` reads the other build's
# preferences. It never once passed. A hosted runner has no session for the
# app's output to be read from, so every file fails at load with "The log
# reader stopped unexpectedly, or never started", and the launch itself hits
# flutter/flutter#176850 ("Failed to foreground app; open returned 1"), which
# is open and reproduces on ordinary desktops too.
#
# So this builds instead of pretending to test. The entitlements the products
# ship with are guarded by `test/macos_entitlements_test.dart`, which is a
# plain test and runs in `analysis.yml`; what is left for a macOS runner is
# whether the thing compiles and links with them — Rust, pods and all. The
# running-app half needs a machine, and is listed in TODOS.md with the rest of
# what does.
name: macOS build

# What can break this and is not already caught elsewhere: the native side.
# `analysis.yml` runs `flutter analyze` and `flutter test` on every Dart change,
# so a change under `lib/` that would fail to compile fails there first, minutes
# earlier and on a cheaper runner. What only a macOS runner can answer is
# whether the project, the pods and the Rust static library still link.
#
# The list used to name `lib/main.dart`, `lib/core/utils/sandbox_import.dart`,
# `lib/core/utils/local_shell.dart` and `integration_test/**`, from when this
# workflow ran `integration_test` on a device and those were its subject. It
# builds now (see above), and `flutter build macos` does not compile
# `integration_test/` at all — so those four bought a 45-minute macOS job for
# any PR that happened to touch `main.dart`, which is most of the ones that
# migrate anything.
on:
  push:
    branches: [ "main" ]
    paths: &macos_paths
      # The Xcode project, the entitlements, the Podfile
      - 'macos/**'
      # cargokit builds and links these into the app; nothing else in CI links
      # the Rust library on macOS
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      # A plugin added or moved changes what pod install resolves and links
      - 'pubspec.yaml'
      - 'pubspec.lock'
      # The vendored packages are submodules, so a gitlink move here is a
      # source change to what gets compiled
      - 'packages/**'
      - '.github/workflows/macos.yml'
  pull_request:
    branches: [ "main" ]
    # The same list. Actions has resolved YAML aliases since 2025-09; before
    # that this was two copies that could drift apart, and did.
    paths: *macos_paths

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install dependencies
        run: flutter pub get

      # No signing identity here, and none needed: the app is signed ad-hoc so
      # it can run at all. The entitlements go with it — trimmed to the ones
      # that do not need a provisioning profile, keeping the only one these
      # tests are about.
      - name: Sign locally
        run: |
          set -euo pipefail
          project=macos/Runner.xcodeproj/project.pbxproj
          sed -i '' \
            -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "-";/' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/' \
            -e 's/DEVELOPMENT_TEAM = BA88US33G6;/DEVELOPMENT_TEAM = "";/' \
            "$project"
          cat > macos/Runner/DebugProfile.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.security.app-sandbox</key>
          	<false/>
          	<key>com.apple.security.cs.allow-jit</key>
          	<true/>
          	<key>com.apple.security.network.client</key>
          	<true/>
          	<key>com.apple.security.network.server</key>
          	<true/>
          	<key>com.apple.security.files.user-selected.read-write</key>
          	<true/>
          </dict>
          </plist>
          EOF

      # `test/macos_entitlements_test.dart` is what guards the entitlements the
      # products actually ship with; it runs in `analysis.yml`, on a checkout
      # the step above has not rewritten.
      - name: Build the unsandboxed app
        run: flutter build macos --debug
