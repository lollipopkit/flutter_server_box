name: Android APK (Fujitsu Arrows 801FJ)

# Builds installable Android APKs from this fork for the Fujitsu Arrows U 801FJ
# (Snapdragon 450, Android 9/10, arm64-v8a with an armeabi-v7a fallback).
#
# It reuses the project's own build inputs instead of inventing a second way to
# build: `.github/actions/setup-flutter` pins the Flutter version, `.github/
# actions/setup-android-sdk` pins the SDK/NDK/build-tools, and
# `scripts/release/build-fdroid.sh` is the script the upstream release and
# F-Droid both build with (it prunes dev-only plugins and builds proot for
# arm64). What is different here is only how the result is signed and where it
# goes: a key made for the run when no release key is configured, and a GitHub
# Release with the APKs attached.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release with the APKs built by this run"
        required: false
        type: boolean
        default: false
      tag:
        description: "Release tag (empty: arrows-801fj-v1.0.<build>)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - arrows801fj
    tags:
      - "arrows-801fj-v*"

permissions:
  contents: write

concurrency:
  group: android-arrows801fj-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Version and asset names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.m.outputs.build }}
      prefix: ${{ steps.m.outputs.prefix }}
      tag: ${{ steps.m.outputs.tag }}
      isRelease: ${{ steps.m.outputs.isRelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      # One place resolves the build number, the asset prefix and the tag, so
      # the jobs below cannot disagree about what they are publishing.
      - name: Resolve build number, prefix and tag
        id: m
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          WANTS_RELEASE: ${{ inputs.release }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          build="$(sed -n -E 's/.*static const int build = ([0-9]+);/\1/p' lib/data/res/build_data.dart | head -n 1)"
          if [ -z "$build" ]; then
            echo "::error::BuildData.build not found in lib/data/res/build_data.dart"
            exit 1
          fi

          prefix="ServerBox_v1.0.${build}_arrows801fj"

          tag="${REQUESTED_TAG//[[:space:]]/}"
          if [ "$IS_TAG" = 'true' ]; then
            tag="$REF_NAME"
          fi
          if [ -z "$tag" ]; then
            tag="arrows-801fj-v1.0.${build}"
          fi

          # A tag push always publishes; a manual dispatch only when asked.
          release=false
          if [ "$WANTS_RELEASE" = 'true' ] || [ "$IS_TAG" = 'true' ]; then
            release=true
          fi

          {
            echo "build=$build"
            echo "prefix=$prefix"
            echo "tag=$tag"
            echo "isRelease=$release"
          } >> "$GITHUB_OUTPUT"
          echo "build $build, tag $tag, release $release"

  build:
    name: Release APK (${{ matrix.label }})
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            label: arm64-v8a
            unsigned: app-arm64-v8a-release-unsigned.apk
          - abi: arm
            label: armeabi-v7a
            unsigned: app-armeabi-v7a-release-unsigned.apk
    env:
      PREFIX: ${{ needs.metadata.outputs.prefix }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      # AGP 9.4 / Gradle 9.8 / Kotlin 2.3, the combination this project's CI
      # builds with. JDK 17 is the floor AGP 9 accepts; 21 is what upstream
      # verified the build on, so a release is not the place to find out whether
      # 17 differs.
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install the pinned Android SDK and NDK
        uses: ./.github/actions/setup-android-sdk

      - name: Fix the Android build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The native-assets hook installs this itself; doing it here makes a
      # toolchain failure its own step rather than a line inside a build log.
      - name: Install the build hook's Rust toolchain
        working-directory: crates/sbm_ffi
        run: rustup toolchain install --profile minimal --no-self-update

      # The same entry point the upstream release and F-Droid use: locked
      # dependencies, dev-only plugins pruned, the plugin registrant made
      # path-independent, proot built with the pinned NDK (arm64), and one
      # unsigned split APK for the ABI asked for.
      - name: Build the unsigned release APK (${{ matrix.abi }})
        shell: bash
        run: scripts/release/build-fdroid.sh ${{ matrix.abi }}

      # An unsigned APK cannot be installed at all. Without a configured
      # release key (repository secrets, see the release notes) the run makes
      # its own key, which is enough to install and test.
      - name: Sign the APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SBX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SBX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SBX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SBX_KEY_PASSWORD }}
          UNSIGNED: build/app/outputs/apk/release/${{ matrix.unsigned }}
          OUT: build/apk-final/${{ needs.metadata.outputs.prefix }}_${{ matrix.label }}.apk
        run: |
          set -euo pipefail
          [ -s "$UNSIGNED" ] || { echo "::error::$UNSIGNED was not built"; exit 1; }
          mkdir -p "$(dirname "$OUT")"

          if [ -n "${KEYSTORE_B64:-}" ]; then
            ks="$RUNNER_TEMP/release-keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
            ks_pass="${KEYSTORE_PASSWORD:?SBX_KEYSTORE_PASSWORD is missing}"
            ks_alias="${KEY_ALIAS:?SBX_KEY_ALIAS is missing}"
            key_pass="${KEY_PASSWORD:-$ks_pass}"
            signer="release keystore from repository secrets"
          else
            ks="$RUNNER_TEMP/arrows801fj-per-run.p12"
            ks_pass="arrows801fj"
            ks_alias="arrows801fj"
            key_pass="arrows801fj"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 \
              -storepass "$ks_pass" -keypass "$key_pass" \
              -alias "$ks_alias" -keyalg EC -groupname secp384r1 \
              -dname "CN=ServerBox Arrows 801FJ per-run test key" -validity 10000 >/dev/null
            signer="per-run test key (no release key configured)"
          fi

          # v1 as well as v2/v3: v2 alone is what the platform reads from
          # Android 7 on, and v1 costs three META-INF entries and removes the
          # guesswork from anything that predates it.
          "$APKSIGNER" sign \
            --ks "$ks" \
            --ks-key-alias "$ks_alias" \
            --ks-pass "pass:$ks_pass" \
            --key-pass "pass:$key_pass" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$OUT" \
            "$UNSIGNED"
          rm -f "$UNSIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          {
            echo "### ${{ matrix.label }}"
            echo ""
            echo "- signed with: $signer"
            echo "- sha256: `$(sha256sum "$OUT" | cut -d' ' -f1)`"
            echo "- size: $(du -h "$OUT" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # What makes this APK the one for this device: an API level the 801FJ's
      # Android 9/10 has, the ABI it asked for, a real signature, and on arm64
      # the two proot binaries the Linux distros run on. A missing proot still
      # installs and runs -- the terminal tab's Linux userland is simply absent
      # -- so nothing else would report it.
      - name: Verify the APK
        shell: bash
        env:
          APK: build/apk-final/${{ needs.metadata.outputs.prefix }}_${{ matrix.label }}.apk
          ABI: ${{ matrix.label }}
        run: |
          set -euo pipefail
          build_tools="$(tr -d '[:space:]' < android/build-tools-version.txt)"
          aapt2="$ANDROID_HOME/build-tools/$build_tools/aapt2"

          [ -s "$APK" ] || { echo "::error::the APK is missing or empty"; exit 1; }
          "$aapt2" dump badging "$APK" > badging.txt
          grep -m1 '^package:' badging.txt
          grep -m1 "sdkVersion:" badging.txt
          grep -m1 "targetSdkVersion:" badging.txt
          grep -m1 "native-code:" badging.txt

          min_sdk="$(sed -n -E "s/.*sdkVersion:'([0-9]+)'.*/\1/p" badging.txt | head -n 1)"
          target_sdk="$(sed -n -E "s/.*targetSdkVersion:'([0-9]+)'.*/\1/p" badging.txt | head -n 1)"
          [ -n "$min_sdk" ] || { echo "::error::no minSdkVersion in the manifest"; exit 1; }

          # Android 9 is API 28, Android 10 is API 29. An APK whose floor is
          # above 28 is refused by the device's package manager before anything
          # else is considered.
          if [ "$min_sdk" -gt 28 ]; then
            echo "::error::minSdkVersion is $min_sdk; the 801FJ runs API 28/29"
            exit 1
          fi

          if ! grep -m1 "native-code:" badging.txt | grep -q "'$ABI'"; then
            echo "::error::the APK carries no $ABI code"
            exit 1
          fi

          "$APKSIGNER" verify "$APK"
          unzip -l "$APK" | grep -q "lib/$ABI/libflutter.so" ||
            { echo "::error::no libflutter.so for $ABI"; exit 1; }

          if [ "$ABI" = 'arm64-v8a' ]; then
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot.so' ||
              { echo "::error::proot is missing; the Linux userland would not exist"; exit 1; }
            unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot-loader.so' ||
              { echo "::error::proot's loader is missing; entering the rootfs would be refused"; exit 1; }
          else
            # proot is built for arm64 only (aarch64-linux-android). Saying so
            # here is what keeps the release notes honest about armv7.
            echo "::notice::armeabi-v7a has no proot by design; Linux distros need the arm64 APK"
          fi

          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ needs.metadata.outputs.prefix }}-android-${{ matrix.label }}
          path: |
            build/apk-final/${{ needs.metadata.outputs.prefix }}_${{ matrix.label }}.apk
            build/apk-final/${{ needs.metadata.outputs.prefix }}_${{ matrix.label }}.apk.sha256
          if-no-files-found: error
          retention-days: 90

  debug:
    name: Debug APK (all ABIs)
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PREFIX: ${{ needs.metadata.outputs.prefix }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install the pinned Android SDK and NDK
        uses: ./.github/actions/setup-android-sdk

      - name: Install the build hook's Rust toolchain
        working-directory: crates/sbm_ffi
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      # Gradle signs this with the standard debug key, which is what `debug`
      # means: a separate package (`tech.lolli.toolbox.debug`), installable
      # beside the release build, JIT instead of AOT. One APK for every ABI, so
      # it installs whatever the device is.
      - name: Build the debug APK
        shell: bash
        run: |
          flutter build apk --debug \
            --build-number="${BUILD_NUMBER}" \
            --build-name="1.0.${BUILD_NUMBER}"

      - name: Collect and verify the debug APK
        shell: bash
        env:
          APK: build/apk-final/${{ needs.metadata.outputs.prefix }}_debug.apk
        run: |
          set -euo pipefail
          build_tools="$(tr -d '[:space:]' < android/build-tools-version.txt)"
          aapt2="$ANDROID_HOME/build-tools/$build_tools/aapt2"

          src="$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-debug.apk' -print -quit)"
          [ -n "$src" ] || { echo "::error::app-debug.apk was not built"; exit 1; }
          mkdir -p "$(dirname "$APK")"
          cp "$src" "$APK"

          "$aapt2" dump badging "$APK" > badging.txt
          grep -m1 '^package:' badging.txt
          grep -m1 "sdkVersion:" badging.txt
          grep -m1 "targetSdkVersion:" badging.txt
          grep -m1 "native-code:" badging.txt
          min_sdk="$(sed -n -E "s/.*sdkVersion:'([0-9]+)'.*/\1/p" badging.txt | head -n 1)"
          if [ "$min_sdk" -gt 28 ]; then
            echo "::error::minSdkVersion is $min_sdk; the 801FJ runs API 28/29"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" | head -n 3
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ needs.metadata.outputs.prefix }}-android-debug
          path: |
            build/apk-final/${{ needs.metadata.outputs.prefix }}_debug.apk
            build/apk-final/${{ needs.metadata.outputs.prefix }}_debug.apk.sha256
          if-no-files-found: error
          retention-days: 90

  # The suite this project ships, split the way its own CI splits it: by file,
  # three shards, because `flutter test` compiles one file at a time and a
  # single runner takes ~30 minutes to get through all of them. No device is
  # involved; the end-to-end suites are excluded, as they are upstream.
  test:
    name: Flutter tests (${{ matrix.shard }}/3)
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter

      - name: Fetch dependencies
        run: flutter pub get

      # `flutter test` builds sbm_ffi through the native-assets hook, and the
      # FFI suites load that build from `build/native_assets`.
      - uses: ./.github/actions/build-hook-cache
        with:
          step: restore

      - name: Run the tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- 'test/*_test.dart' \
            ':!test/e2e/*' ':!test/*_e2e_test.dart' | sort \
            | awk -v n=3 -v i=${{ matrix.shard }} '(NR - 1) % n == i')
          echo "${#files[@]} test files in this shard"
          flutter test "${files[@]}"

  publish:
    name: Publish the release
    needs:
      - metadata
      - build
      - debug
    if: needs.metadata.outputs.isRelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Collect the APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ needs.metadata.outputs.prefix }}-android-*
          path: assets
          merge-multiple: true

      - name: Checksums and completeness
        shell: bash
        working-directory: assets
        run: |
          set -euo pipefail
          ls -la
          for want in \
            "${{ needs.metadata.outputs.prefix }}_arm64-v8a.apk" \
            "${{ needs.metadata.outputs.prefix }}_armeabi-v7a.apk" \
            "${{ needs.metadata.outputs.prefix }}_debug.apk"; do
            [ -s "$want" ] || { echo "::error::missing $want"; exit 1; }
          done
          files=(*.apk)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ServerBox 1.0.${{ needs.metadata.outputs.build }} for Fujitsu Arrows 801FJ
          draft: false
          fail_on_unmatched_files: true
          files: |
            assets/*.apk
            assets/SHA256SUMS
          body: |
            > Nenhum destes APKs foi testado num Arrows 801FJ fisico. O que esta
            > verificado foi verificado no GitHub Actions.

            ServerBox **1.0.${{ needs.metadata.outputs.build }}**, compilado a partir
            do fork `eduardo20042004/flutter_server_box` (fluxo de trabalho
            `android-build.yml`).

            ### Qual ficheiro instalar

            | Ficheiro | ABI | Linux (PRoot) |
            | --- | --- | --- |
            | `ServerBox_v1.0.${{ needs.metadata.outputs.build }}_arrows801fj_arm64-v8a.apk` | **arm64-v8a** | incluido |
            | `ServerBox_v1.0.${{ needs.metadata.outputs.build }}_arrows801fj_armeabi-v7a.apk` | armeabi-v7a | nao existe |
            | `ServerBox_v1.0.${{ needs.metadata.outputs.build }}_arrows801fj_debug.apk` | todas | incluido (arm64) |

            Comeca pelo **arm64-v8a**. O Snapdragon 450 e um SoC de 64 bits e o
            PRoot so e compilado para aarch64: no APK `armeabi-v7a` a app instala
            e funciona, mas o separador de Linux nao tem motor para arrancar.

            ### Requisitos

            - **Android minimo: 7.0 (API 24)**. Android 9 (API 28) e Android 10
              (API 29) do 801FJ estao dentro do suportado.
            - **ABIs:** arm64-v8a, armeabi-v7a.
            - Espaco livre: ~200 MB para a app e o sistema Linux que instalares.

            ### O que foi verificado nesta compilacao

            O fluxo de trabalho falha se qualquer uma destas condicoes nao se
            verificar: APK existente e nao vazio, `minSdkVersion` <= 28,
            `targetSdkVersion` lido do manifesto, ABI presente no manifesto e
            `libflutter.so` para essa ABI, `libproot.so` e `libproot-loader.so`
            no arm64, e assinatura valida (`apksigner verify`). Os SHA-256 estao
            no anexo `SHA256SUMS`.

            ### Assinatura

            Cada compilacao e assinada com uma chave criada para essa execucao,
            a menos que o repositorio tenha a chave de release nos secrets
            `SBX_KEYSTORE_BASE64`, `SBX_KEYSTORE_PASSWORD`, `SBX_KEY_ALIAS` e
            `SBX_KEY_PASSWORD`. Consequencia pratica: instalacoes de execucoes
            diferentes nao se substituem umas as outras. Para atualizar sem
            perder dados, exporta as configuracoes na app antes de desinstalar a
            versao antiga, ou configura a chave de release nos secrets.

            ### Instalar no 801FJ

            1. Descarrega o APK `arm64-v8a` (ou o `debug` para testar).
            2. Android 9/10: Definicoes > Aplicacoes > Acesso especial >
               Instalar apps desconhecidas > escolhe o browser ou o gestor de
               ficheiros que vais usar.
            3. Se ja tens o ServerBox instalado de outra fonte, desinstala-o
               primeiro: outra chave de assinatura faz o Android recusar a
               instalacao com "App not installed".
            4. Abre o ficheiro e instala. Se o Play Protect avisar, e esperado
               num APK assinado com uma chave que ele nao conhece.
            5. Para o terminal Linux: abre o separador de terminal, instala uma
               distribuicao (Alpine e a mais leve para 3 GB de RAM) e confirma
               que o PRoot arranca.

  status:
    name: Build summary
    needs:
      - metadata
      - build
      - debug
    if: always() && needs.metadata.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the summary
        shell: bash
        env:
          BUILD: ${{ needs.metadata.outputs.build }}
          TAG: ${{ needs.metadata.outputs.tag }}
          IS_RELEASE: ${{ needs.metadata.outputs.isRelease }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEBUG_RESULT: ${{ needs.debug.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ServerBox ${BUILD} - Arrows 801FJ"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Release APKs | ${BUILD_RESULT} |"
            echo "| Debug APK | ${DEBUG_RESULT} |"
            echo "| Tag | `${TAG}` |"
            echo "| Published | ${IS_RELEASE} |"
            echo "| Run | ${RUN_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
