# Checks that everyone who authored a commit in a pull request has signed the
# CLA (see /CLA.md), and records signatures given as a pull request comment.
# The logic and its tests live in lollipopkit/cla-actions; signatures stay on
# this repository's `cla-signatures` branch.
#
# The verdict is this job's check run, named `CLA`: make that a required check
# for `main`. A comment run is not attached to the head commit, so after a
# signature or `recheck` it re-runs the latest `pull_request_target` run.
#
# Security note: this runs on `pull_request_target`, so it holds a write token
# while a pull request from a fork is in play. The action never checks out or
# executes repository content; keep it pinned by SHA.

name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write # append to the cla-signatures branch
  pull-requests: write # post the "please sign" comment
  actions: write # re-run the check after a signature

concurrency:
  # Never cancel in progress: a cancelled run could drop a signature write.
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip on forks of this repository, and skip the vast majority of comments
    # without spinning up a runner. The action re-checks the comment body
    # strictly; `contains` here is only a cheap pre-filter.
    if: >-
      github.repository == 'lollipopkit/flutter_server_box' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA') ||
         contains(github.event.comment.body, 'recheck'))))
    steps:
      - uses: lollipopkit/cla-actions@cb8ab238a96f2736f19a9bf258a49af3c6eed7bd # v2.0.0
        with:
          note: >-
            It lets this work ship in the App Store builds alongside the
            AGPLv3 source. You keep the copyright to what you wrote.
