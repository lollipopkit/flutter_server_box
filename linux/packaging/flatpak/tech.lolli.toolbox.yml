# Flathub manifest template for ServerBox.
# Render with scripts/release/flathub.sh (sets URL and SHA256).
app-id: tech.lolli.toolbox
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: serverbox
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  # Store credentials via Secret Service (flutter_secure_storage / libsecret).
  - --talk-name=org.freedesktop.secrets
  # System tray status icon (AppIndicator / StatusNotifier).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Read existing SSH configs and private keys without requesting host access.
  - --filesystem=~/.ssh:ro

modules:
  - name: serverbox
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - mkdir -p /app/serverbox /app/bin
      - cp -a bundle/. /app/serverbox/
      - ln -s /app/serverbox/ServerBox /app/bin/serverbox
      - install -Dm644 share/applications/${FLATPAK_ID}.desktop -t /app/share/applications/
      - install -Dm644 share/metainfo/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png -t /app/share/icons/hicolor/512x512/apps/
      - install -Dm644 share/licenses/${FLATPAK_ID}/LICENSE -t /app/share/licenses/${FLATPAK_ID}/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: ${URL}
        sha256: '${SHA256}'
        x-checker-data:
          type: json
          url: https://api.github.com/repos/lollipopkit/flutter_server_box/releases/latest
          tag-query: .tag_name
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | endswith("_linux_amd64.tar.gz")) | .browser_download_url
