#:schema https://raw.githubusercontent.com/lollipopkit/flutter_server_box/main/docs/schemas/fsbt-manifest.schema.json
# Pride: one package, one theme per flag. Everything below [variants] is what
# the variants share; each variant draws its colors and its tile over it, and
# carries its own stripes and heart in variants/<key>/.

id = "serverbox.pride"
name = "Pride"
modes = ["light", "dark"]

# [variants], background.tile and the schema 3 components.
[schema]
min = 3
max = 3

[colors]
mode = 0

[icons]
style = "classic"

# The flag's stripes at 45 degrees, one period per tile, faint over the
# surface. Each variant's background.png is in variants/<key>/.
[background]
type = "image"
image = "background.png"
opacity = 0.12
blur = 0

[splash]
color = "surface"
logo = "splash_logo.svg"
duration = 900

[shapes]
card = 16
tile = 12
button = 20

# Solid cards and sheets over the stripes, so what is on them reads first.
[components.card]
backgroundColor = "surfaceContainerLowest"
radius = 16
borderColor = "outlineVariant"
borderWidth = 1
elevation = 0
surfaceTintColor = 0x00000000

[components.dark.card]
backgroundColor = "surfaceContainerLow"

[components.tile]
selectedTileColor = "primaryContainer"
selectedColor = "onPrimaryContainer"
iconColor = "onSurfaceVariant"
radius = 12

[components.button]
backgroundColor = "primary"
foregroundColor = "onPrimary"
radius = 20
elevation = 0
minHeight = 38

[components.button.hovered]
backgroundColor = "secondary"
foregroundColor = "onSecondary"

[components.button.disabled]
backgroundColor = "surfaceContainerHighest"
foregroundColor = "outline"

[components.textButton]
foregroundColor = "primary"
radius = 14
padding = [10, 5, 10, 5]
minHeight = 30

[components.outlinedButton]
foregroundColor = "primary"
borderColor = "outlineVariant"
borderWidth = 1
radius = 20

[components.iconButton]
foregroundColor = "onSurfaceVariant"
radius = 14

[components.iconButton.hovered]
foregroundColor = "primary"

[components.input]
filled = true
fillColor = "surfaceContainerLow"
radius = 12
borderColor = "outlineVariant"
borderWidth = 1
focusedBorderColor = "primary"
errorBorderColor = "error"

[components.search]
backgroundColor = "surfaceContainer"
radius = 17
borderColor = "outlineVariant"
borderWidth = 1
iconColor = "primary"
hintColor = "outline"

[components.appBar]
backgroundColor = 0x00000000
iconColor = "primary"
elevation = 0
surfaceTintColor = 0x00000000

[components.navigation]
backgroundColor = "surfaceContainerLow"
indicatorColor = "primaryContainer"
indicatorRadius = 16
selectedIconColor = "onPrimaryContainer"
unselectedIconColor = "onSurfaceVariant"
selectedLabelColor = "primary"
unselectedLabelColor = "onSurfaceVariant"
elevation = 0

[components.segmented]
backgroundColor = "surfaceContainer"
selectedColor = "secondaryContainer"
textColor = "onSurfaceVariant"
selectedTextColor = "onSecondaryContainer"
radius = 14

[components.sidebar]
selectedColor = "primaryContainer"
selectedTextColor = "onPrimaryContainer"
selectedIconColor = "primary"
radius = 12

[components.dialog]
backgroundColor = "surfaceContainerLowest"
radius = 24
borderColor = "outlineVariant"
borderWidth = 1
elevation = 0
surfaceTintColor = 0x00000000

[components.dark.dialog]
backgroundColor = "surfaceContainer"

[components.sheet]
backgroundColor = "surfaceContainerLowest"
radius = 24
elevation = 0
surfaceTintColor = 0x00000000
dragHandleColor = "outlineVariant"

[components.dark.sheet]
backgroundColor = "surfaceContainer"

[components.menu]
backgroundColor = "surfaceContainerLowest"
radius = 14
borderColor = "outlineVariant"
borderWidth = 1
elevation = 2
surfaceTintColor = 0x00000000

[components.dark.menu]
backgroundColor = "surfaceContainerHigh"

[components.tooltip]
backgroundColor = "inverseSurface"
textColor = "onInverseSurface"
radius = 10

[components.toast]
backgroundColor = "inverseSurface"
textColor = "onInverseSurface"
radius = 16
elevation = 2

[components.switch]
selectedThumbColor = "onPrimary"
selectedTrackColor = "primary"
selectedTrackOutlineColor = 0x00000000

[components.slider]
activeTrackColor = "primary"
inactiveTrackColor = "primaryContainer"
thumbColor = "primary"

[components.progress]
color = "primary"
trackColor = "primaryContainer"
thickness = 5
radius = 3

[components.badge]
backgroundColor = "secondary"
textColor = "onSecondary"

[components.chip]
selectedColor = "secondaryContainer"
radius = 12

[components.divider]
color = "outlineVariant"

# Monica Helms' transgender flag (1999): free for anyone to use. The stripes and the heart are drawn
