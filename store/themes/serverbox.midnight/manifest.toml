#:schema https://raw.githubusercontent.com/lollipopkit/flutter_server_box/main/docs/schemas/fsbt-manifest.schema.json
id = "serverbox.midnight"
name = "Midnight"
modes = ["dark"]

# SVG icons, icon colors and a splash: schema 2 features.
[schema]
min = 2
max = 2

[colors]
mode = 2
seed = 0xFF8AB4F8

# Deep navy, moonlight blue, and an aurora of teal and violet.
[colors.palette.dark]
primary = 0xFF8AB4F8
onPrimary = 0xFF0B1220
primaryContainer = 0xFF1E3558
onPrimaryContainer = 0xFFD6E4FF
secondary = 0xFF7EE0C3
onSecondary = 0xFF062019
secondaryContainer = 0xFF173F3A
onSecondaryContainer = 0xFFC4F5E6
tertiary = 0xFFC9A7FF
onTertiary = 0xFF1D1236
tertiaryContainer = 0xFF352A5C
onTertiaryContainer = 0xFFEBDDFF
error = 0xFFFF8A8A
onError = 0xFF2B0B0B
errorContainer = 0xFF4F1D24
onErrorContainer = 0xFFFFD9D9
surface = 0xFF0B1220
surfaceDim = 0xFF080E19
surfaceBright = 0xFF2A3A57
surfaceContainerLowest = 0xFF070C16
surfaceContainerLow = 0xFF0F1829
surfaceContainer = 0xFF131E32
surfaceContainerHigh = 0xFF18253C
surfaceContainerHighest = 0xFF1E2C46
onSurface = 0xFFE3EAF5
onSurfaceVariant = 0xFF9FB0C8
outline = 0xFF71829C
outlineVariant = 0xFF24324A
inverseSurface = 0xFFE3EAF5
onInverseSurface = 0xFF0B1220
inversePrimary = 0xFF3564B5
shadow = 0xFF000000
scrim = 0xFF000000
surfaceTint = 0

[icons]
style = "classic"

# Thin, airy strokes.
[icons.images]
"tab.server" = "icons/tab_server.svg"
"tab.server.selected" = "icons/tab_server_selected.svg"
"tab.ssh" = "icons/tab_ssh.svg"
"tab.ssh.selected" = "icons/tab_ssh_selected.svg"
"tab.file" = "icons/tab_file.svg"
"tab.file.selected" = "icons/tab_file_selected.svg"
"tab.snippet" = "icons/tab_snippet.svg"
"tab.snippet.selected" = "icons/tab_snippet_selected.svg"
"tab.agent" = "icons/tab_agent.svg"
"tab.agent.selected" = "icons/tab_agent_selected.svg"
"tab.benchmark" = "icons/tab_benchmark.svg"
"tab.benchmark.selected" = "icons/tab_benchmark_selected.svg"
"tab.remoteDesktop" = "icons/tab_remoteDesktop.svg"
"tab.remoteDesktop.selected" = "icons/tab_remoteDesktop_selected.svg"
"tab.virt" = "icons/tab_virt.svg"
"tab.virt.selected" = "icons/tab_virt_selected.svg"
"nav.more" = "icons/nav_more.svg"
"nav.settings" = "icons/nav_settings.svg"
"nav.tune" = "icons/nav_tune.svg"
"nav.privacy" = "icons/nav_privacy.svg"
"nav.agent" = "icons/nav_agent.svg"
"nav.tabs" = "icons/nav_tabs.svg"
"nav.server" = "icons/nav_server.svg"
"nav.sort" = "icons/nav_sort.svg"
"nav.terminal" = "icons/nav_terminal.svg"
"nav.folder" = "icons/nav_folder.svg"
"nav.cloud" = "icons/nav_cloud.svg"
"nav.snippet" = "icons/nav_snippet.svg"
"nav.inbox" = "icons/nav_inbox.svg"
"nav.key" = "icons/nav_key.svg"
"nav.info" = "icons/nav_info.svg"
"nav.download" = "icons/nav_download.svg"
"nav.desktop" = "icons/nav_desktop.svg"

[icons.colors]
"tab.server.selected" = "primary"
"tab.ssh.selected" = "secondary"
"tab.file.selected" = "primary"
"tab.snippet.selected" = "secondary"
"tab.agent.selected" = "tertiary"
"tab.benchmark.selected" = "secondary"
"tab.remoteDesktop.selected" = "primary"
"tab.virt.selected" = "tertiary"
"nav.agent" = "tertiary"
"nav.cloud" = "secondary"
"nav.privacy" = "secondary"

# The night sky behind translucent cards.
[background]
type = "gradient"

[splash]
color = "surface"
logo = "splash_logo.svg"
duration = 800

[shapes]
card = 20
tile = 14
button = 14

# Glass: the gradient shows through.
[components.card]
backgroundColor = 0xB3131E32
radius = 20
borderColor = 0x2E9FB0C8
borderWidth = 1
elevation = 0
surfaceTintColor = 0
margin = [6, 5, 6, 5]

[components.tile]
selectedTileColor = "primaryContainer"
selectedColor = "onPrimaryContainer"
iconColor = "onSurfaceVariant"
radius = 14

[components.button]
backgroundColor = "primary"
foregroundColor = "onPrimary"
radius = 14
elevation = 0
padding = [20, 11, 20, 11]

[components.button.hovered]
backgroundColor = "secondary"
foregroundColor = "onSecondary"

[components.button.pressed]
overlayColor = 0x33000000

[components.button.focused]
borderColor = "tertiary"
borderWidth = 2

[components.button.disabled]
backgroundColor = "surfaceContainerHighest"
foregroundColor = "outline"

[components.input]
filled = true
fillColor = 0x99131E32
radius = 14
borderColor = 0x339FB0C8
borderWidth = 1
focusedBorderColor = "secondary"
errorBorderColor = "error"
padding = [14, 11, 14, 11]

[components.navigation]
backgroundColor = 0xE60B1220
indicatorColor = 0x3D8AB4F8
indicatorRadius = 16
selectedIconColor = "primary"
unselectedIconColor = "onSurfaceVariant"
selectedLabelColor = "primary"
unselectedLabelColor = "onSurfaceVariant"
elevation = 0

[components.dialog]
backgroundColor = 0xF2131E32
radius = 24
borderColor = 0x339FB0C8
borderWidth = 1
elevation = 0
surfaceTintColor = 0
barrierColor = 0x99070C16

[components.sheet]
backgroundColor = 0xF20F1829
radius = 28
borderColor = 0x339FB0C8
borderWidth = 1
elevation = 0
surfaceTintColor = 0
barrierColor = 0x80070C16
dragHandleColor = "secondary"
