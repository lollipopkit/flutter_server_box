#:schema https://raw.githubusercontent.com/lollipopkit/flutter_server_box/main/docs/schemas/fsbt-manifest.schema.json
id = "serverbox.dracula"
name = "Dracula"
# Dracula at night, Alucard (its official light variant) by day.
modes = ["light", "dark"]

# SVG icons, icon colors and a splash: schema 2 features.
[schema]
min = 2
max = 2

[colors]
mode = 2
seed = 0xFFBD93F9

# Alucard.
[colors.palette.light]
primary = 0xFF644AC9
onPrimary = 0xFFFFFFFF
primaryContainer = 0xFFE6DEFF
onPrimaryContainer = 0xFF2B1A6B
secondary = 0xFFA3144D
onSecondary = 0xFFFFFFFF
secondaryContainer = 0xFFFBD9E6
onSecondaryContainer = 0xFF4A0620
tertiary = 0xFF14710A
onTertiary = 0xFFFFFFFF
tertiaryContainer = 0xFFD4F2CC
onTertiaryContainer = 0xFF0A3304
error = 0xFFCB3A2A
onError = 0xFFFFFFFF
errorContainer = 0xFFFADAD5
onErrorContainer = 0xFF5C140C
surface = 0xFFFFFBEB
surfaceDim = 0xFFE6E0C9
surfaceBright = 0xFFFFFDF5
surfaceContainerLowest = 0xFFFFFFFF
surfaceContainerLow = 0xFFF7F2DD
surfaceContainer = 0xFFF1EBD4
surfaceContainerHigh = 0xFFEAE3CB
surfaceContainerHighest = 0xFFE2DAC0
onSurface = 0xFF1F1F1F
onSurfaceVariant = 0xFF5A548A
outline = 0xFF7E78A8
outlineVariant = 0xFFD6CFB6
inverseSurface = 0xFF282A36
onInverseSurface = 0xFFF8F8F2
inversePrimary = 0xFFBD93F9
shadow = 0xFF000000
scrim = 0xFF000000
surfaceTint = 0

# Dracula.
[colors.palette.dark]
primary = 0xFFBD93F9
onPrimary = 0xFF282A36
primaryContainer = 0xFF4A3F6B
onPrimaryContainer = 0xFFEDE3FF
secondary = 0xFFFF79C6
onSecondary = 0xFF282A36
secondaryContainer = 0xFF5A3252
onSecondaryContainer = 0xFFFFD9EF
tertiary = 0xFF50FA7B
onTertiary = 0xFF282A36
tertiaryContainer = 0xFF2A4A35
onTertiaryContainer = 0xFFC8FFD6
error = 0xFFFF5555
onError = 0xFF282A36
errorContainer = 0xFF5C2A2E
onErrorContainer = 0xFFFFD6D6
surface = 0xFF282A36
surfaceDim = 0xFF21222C
surfaceBright = 0xFF4D5066
surfaceContainerLowest = 0xFF1E1F29
surfaceContainerLow = 0xFF2E303E
surfaceContainer = 0xFF343746
surfaceContainerHigh = 0xFF3B3E4F
surfaceContainerHighest = 0xFF44475A
onSurface = 0xFFF8F8F2
onSurfaceVariant = 0xFFA5AECF
outline = 0xFF7B86B4
outlineVariant = 0xFF44475A
inverseSurface = 0xFFF8F8F2
onInverseSurface = 0xFF282A36
inversePrimary = 0xFF644AC9
shadow = 0xFF000000
scrim = 0xFF000000
surfaceTint = 0

[icons]
style = "classic"

# One hand-drawn set: soft, round, a little heavy.
[icons.images]
"tab.server" = "icons/tab_server.svg"
"tab.server.selected" = "icons/tab_server_selected.svg"
"tab.ssh" = "icons/tab_ssh.svg"
"tab.ssh.selected" = "icons/tab_ssh_selected.svg"
"tab.file" = "icons/tab_file.svg"
"tab.file.selected" = "icons/tab_file_selected.svg"
"tab.snippet" = "icons/tab_snippet.svg"
"tab.snippet.selected" = "icons/tab_snippet_selected.svg"
"tab.agent" = "icons/tab_agent.svg"
"tab.agent.selected" = "icons/tab_agent_selected.svg"
"tab.benchmark" = "icons/tab_benchmark.svg"
"tab.benchmark.selected" = "icons/tab_benchmark_selected.svg"
"tab.remoteDesktop" = "icons/tab_remoteDesktop.svg"
"tab.remoteDesktop.selected" = "icons/tab_remoteDesktop_selected.svg"
"tab.virt" = "icons/tab_virt.svg"
"tab.virt.selected" = "icons/tab_virt_selected.svg"
"nav.more" = "icons/nav_more.svg"
"nav.settings" = "icons/nav_settings.svg"
"nav.tune" = "icons/nav_tune.svg"
"nav.privacy" = "icons/nav_privacy.svg"
"nav.agent" = "icons/nav_agent.svg"
"nav.tabs" = "icons/nav_tabs.svg"
"nav.server" = "icons/nav_server.svg"
"nav.sort" = "icons/nav_sort.svg"
"nav.terminal" = "icons/nav_terminal.svg"
"nav.folder" = "icons/nav_folder.svg"
"nav.cloud" = "icons/nav_cloud.svg"
"nav.snippet" = "icons/nav_snippet.svg"
"nav.inbox" = "icons/nav_inbox.svg"
"nav.key" = "icons/nav_key.svg"
"nav.info" = "icons/nav_info.svg"
"nav.download" = "icons/nav_download.svg"
"nav.desktop" = "icons/nav_desktop.svg"

# Every tab lights up in its own Dracula accent when selected.
[icons.colors]
"tab.server.selected" = "primary"
"tab.ssh.selected" = "tertiary"
"tab.file.selected" = "secondary"
"tab.snippet.selected" = "primary"
"tab.agent.selected" = "secondary"
"tab.benchmark.selected" = "tertiary"
"tab.remoteDesktop.selected" = "primary"
"tab.virt.selected" = "secondary"
"nav.agent" = "secondary"
"nav.terminal" = "tertiary"
"nav.privacy" = "tertiary"
"nav.key" = "secondary"
"nav.cloud" = "primary"
"nav.download" = "tertiary"

[background]
type = "gradient"

[splash]
color = "surface"
logo = "splash_logo.svg"
duration = 700

[shapes]
card = 18
tile = 14
button = 40

[components.card]
backgroundColor = "surfaceContainer"
radius = 18
borderColor = "outlineVariant"
borderWidth = 0
elevation = 0
surfaceTintColor = 0
margin = [6, 5, 6, 5]

[components.tile]
selectedTileColor = "primaryContainer"
selectedColor = "onPrimaryContainer"
iconColor = "onSurfaceVariant"
radius = 14

[components.button]
backgroundColor = "primary"
foregroundColor = "onPrimary"
radius = 40
elevation = 0
padding = [22, 12, 22, 12]

[components.button.hovered]
backgroundColor = "secondary"
foregroundColor = "onSecondary"

[components.button.pressed]
overlayColor = 0x33000000

[components.button.focused]
borderColor = "secondary"
borderWidth = 2

[components.button.disabled]
backgroundColor = "surfaceContainerHighest"
foregroundColor = "onSurfaceVariant"

[components.input]
filled = true
fillColor = "surfaceContainerHigh"
radius = 14
borderColor = "outlineVariant"
borderWidth = 1
focusedBorderColor = "secondary"
errorBorderColor = "error"
padding = [14, 11, 14, 11]

[components.navigation]
backgroundColor = "surfaceContainerLow"
indicatorColor = "primaryContainer"
indicatorRadius = 16
selectedIconColor = "primary"
unselectedIconColor = "onSurfaceVariant"
selectedLabelColor = "primary"
unselectedLabelColor = "onSurfaceVariant"
elevation = 0

[components.dialog]
backgroundColor = "surfaceContainerHigh"
radius = 24
borderColor = "outlineVariant"
borderWidth = 1
elevation = 0
surfaceTintColor = 0
barrierColor = 0x99000000

[components.sheet]
backgroundColor = "surfaceContainerLow"
radius = 28
elevation = 0
surfaceTintColor = 0
dragHandleColor = "secondary"

[components.light.dialog]
barrierColor = 0x66282A36
