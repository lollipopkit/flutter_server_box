# Grafana 13.2.4 (AGPL-3.0), https://github.com/grafana/grafana/tree/v13.2.4
#
# Written for ServerBox Monitor (2026-10-18) from Grafana's "Run Grafana
# Docker image" guide (docker compose example):
# - no `name:` and no `container_name`: the agent names the project;
# - image pinned to the release; a bind mount from the env file instead of
#   the named volume; run as the shared folder's owner;
# - the administrator (admin) is made on the first start with the generated
#   password (GF_SECURITY_ADMIN_PASSWORD); sign-up stays off (Grafana's
#   default);
# - seed-mcp is a one-shot job: once Grafana answers, it makes a service
#   account for Agent mode (Editor) with a token, once, into a folder the MCP
#   server reads: it never holds the administrator's password. A token set in
#   the app's settings is used instead;
# - mcp: Grafana's own MCP server (grafana/mcp-grafana 2.0.2, Apache-2.0),
#   pinned by digest, published on loopback alone, asking for MCP_TOKEN; its
#   anonymous usage statistics off.

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    user: "${SBM_UID}:${SBM_GID}"
    environment:
      TZ: ${SBM_TZ}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL}
    volumes:
      - ${GRAFANA_DATA}:/var/lib/grafana
    ports:
      - '${GRAFANA_BIND}:${GRAFANA_PORT}:3000'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  seed-mcp:
    image: grafana/grafana:${GRAFANA_VERSION}
    user: "${SBM_UID}:${SBM_GID}"
    depends_on:
      grafana:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ${GRAFANA_DATA}:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        mkdir -p /data/serverbox-mcp
        [ -s /data/serverbox-mcp/token ] && exit 0
        # The password in a file curl reads, never on a command line.
        netrc=$$(mktemp)
        trap 'rm -f "$$netrc"' EXIT
        printf 'machine grafana login admin password %s\n' "$$ADMIN_PASSWORD" > "$$netrc"
        api() { curl -fsS --netrc-file "$$netrc" -H 'content-type: application/json' "$$@"; }
        # A password changed since leaves Agent mode's token to the admin (the
        # app's setting): Grafana itself is not held back.
        made=$$(api -X POST --data '{"name":"Agent mode","role":"Editor"}' http://grafana:3000/api/serviceaccounts) \
          || made=$$(api 'http://grafana:3000/api/serviceaccounts/search?query=Agent%20mode') \
          || { echo "no token for Agent mode: the administrator's password was refused"; exit 0; }
        id=$$(printf '%s' "$$made" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
        [ -n "$$id" ] || { echo "no service account: $$made"; exit 1; }
        token=$$(api -X POST --data "{\"name\":\"Agent mode $$(date +%s)\"}" "http://grafana:3000/api/serviceaccounts/$$id/tokens" \
          | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')
        [ -n "$$token" ] || { echo "no token"; exit 1; }
        printf '%s' "$$token" > /data/serverbox-mcp/token
    restart: "no"

  mcp:
    image: grafana/mcp-grafana:2.0.2-alpine@sha256:2588c4d5a9fd5e274f9633acfbf2e7076484d10e042faf0f0e2838b7fc973d0a
    user: "${SBM_UID}:${SBM_GID}"
    depends_on:
      seed-mcp:
        condition: service_completed_successfully
    environment:
      GRAFANA_URL: http://grafana:3000
      MCP_GRAFANA_SERVER_TOKEN: ${MCP_TOKEN}
      GRAFANA_USAGE_STATS: disabled
      GRAFANA_MCP_TOKEN: ${GRAFANA_MCP_TOKEN:-}
    volumes:
      - ${GRAFANA_DATA}/serverbox-mcp:/key:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        # The admin's own token (the app's setting) first, else the seed job's.
        GRAFANA_SERVICE_ACCOUNT_TOKEN=$${GRAFANA_MCP_TOKEN:-$$(cat /key/token 2>/dev/null)}
        unset GRAFANA_MCP_TOKEN
        if [ -z "$$GRAFANA_SERVICE_ACCOUNT_TOKEN" ]; then
          echo "no token for Agent mode: set one in the app's settings"
          while :; do sleep 3600; done
        fi
        export GRAFANA_SERVICE_ACCOUNT_TOKEN
        # Any Host: reached through a published port, and every request needs
        # MCP_TOKEN, which a page rebinding a name to it cannot send.
        exec /app/mcp-grafana -t streamable-http --address 0.0.0.0:8000 --allowed-hosts '*'
    ports:
      - '127.0.0.1:${MCP_PORT}:8000'
    restart: unless-stopped
