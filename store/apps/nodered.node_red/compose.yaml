# Node-RED 5.0.8 (Apache-2.0), https://github.com/node-red/node-red/tree/5.0.8
# Image: https://github.com/node-red/node-red-docker (tag 5.0.8)
#
# Written for ServerBox Monitor (2026-10-18) from Node-RED's "Running under
# Docker" guide:
# - no `name:` and no `container_name`: the agent names the project;
# - image pinned to the release; the data folder from the env file; runs as
#   the shared folder's owner;
# - settings.js beside this file (--settings) instead of the one Node-RED
#   copies into the data folder: its defaults, with the editor and admin API
#   behind a sign-in (admin, the generated password's bcrypt hash) and the
#   credentials' key generated once.

services:
  node-red:
    image: nodered/node-red:${NODE_RED_VERSION}
    user: "${SBM_UID}:${SBM_GID}"
    command: ["--settings", "/serverbox/settings.js"]
    environment:
      TZ: ${SBM_TZ}
      NODE_RED_ADMIN_HASH: ${NODE_RED_PASSWORD_BCRYPT}
      NODE_RED_CREDENTIAL_SECRET: ${NODE_RED_CREDENTIAL_SECRET}
    volumes:
      - ${NODE_RED_DATA}:/data
      - ./settings.js:/serverbox/settings.js:ro
    ports:
      - '${NODE_RED_BIND}:${NODE_RED_PORT}:1880'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1880/auth/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
