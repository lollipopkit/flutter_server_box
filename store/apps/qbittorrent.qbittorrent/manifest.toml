#:schema https://raw.githubusercontent.com/lollipopkit/flutter_server_box/main/docs/schemas/monitor-app.schema.json
# qBittorrent, as the Monitor's Downloads app: deployed with Docker Compose from
# the file beside this one, shown in a desk window through the agent.

schema = 1
publisher = "qbittorrent"
name = "qbittorrent"
project = "qBittorrent"
developer = "The qBittorrent project"
version = "5.2.4"
homepage = "https://www.qbittorrent.org"
source = "https://github.com/qbittorrent/qBittorrent/tree/release-5.2.4"
glyph = "download"
tone = "teal"
categories = ["files", "network"]
notices = ["pullsImages", "bindsPaths", "publishesPort"]

[title]
en = "qBittorrent"

[description]
en = "Download files over BitTorrent. Finished files are kept in the shared downloads folder, where media apps can use them."
zh = "通过 BitTorrent 下载文件。下载完成的文件保存在共享的下载文件夹中，媒体应用可以直接使用。"
zh-TW = "透過 BitTorrent 下載檔案。下載完成的檔案保存在共用的下載資料夾中，媒體應用程式可以直接使用。"

# qBittorrent's source is GPLv2 or later (COPYING at the pinned tag). The binary
# release is GPLv3 or later, because it bundles GPLv3+ assets.
[license]
spdx = "GPL-2.0-or-later"
url = "https://github.com/qbittorrent/qBittorrent/blob/release-5.2.4/COPYING"
accept = true

# The image is linuxserver.io's build (Alpine, amd64 and arm64 only).
[requirements]
arch = ["amd64", "arm64"]
os = ["linux"]

[compose]
files = ["compose.yaml"]
jobs = ["seed-config"]

[web]
port = "web"
path = "/"

[env]
QBITTORRENT_TAG = "5.2.4_v2.0.15-ls480"

[[secrets]]
env = "QBITTORRENT_PASSWORD"
length = 32

[login]
user = "admin"
password = "QBITTORRENT_PASSWORD"
note = { en = "The password is written into qBittorrent's settings on first deployment. Changing it in qBittorrent's Web UI settings keeps the new one; the password shown here stays the one first written.", zh = "首次部署时，此密码会写入 qBittorrent 的设置。之后在 qBittorrent 的 Web UI 设置中修改密码会保留新密码；此处显示的仍是首次写入的密码。", zh-TW = "首次部署時，此密碼會寫入 qBittorrent 的設定。之後在 qBittorrent 的 Web UI 設定中修改密碼會保留新密碼；此處顯示的仍是首次寫入的密碼。" }

[[settings]]
key = "config"
type = "path"
env = "QBITTORRENT_CONFIG"
default = "{stack}/config"
data = true
label = { en = "Settings", zh = "设置", zh-TW = "設定" }
help = { en = "qBittorrent's configuration, torrents and resume data.", zh = "qBittorrent 的配置、种子和续传数据。", zh-TW = "qBittorrent 的設定、種子與續傳資料。" }

[[settings]]
key = "downloads"
type = "path"
env = "DOWNLOADS_LOCATION"
default = "{shared}/downloads"
data = false
label = { en = "Downloads folder", zh = "下载文件夹", zh-TW = "下載資料夾" }
help = { en = "Shared with the media apps. Unfinished files are kept in incomplete/ inside it.", zh = "与媒体应用共享。未完成的文件保存在其中的 incomplete/ 中。", zh-TW = "與媒體應用程式共用。未完成的檔案保存在其中的 incomplete/ 中。" }

[[settings]]
key = "web"
type = "port"
env = "QBITTORRENT_PORT"
default = 8080
label = { en = "Web UI port", zh = "Web UI 端口", zh-TW = "Web UI 連接埠" }

[[settings]]
key = "expose"
type = "bool"
default = false
label = { en = "Web UI reachable from the network", zh = "Web UI 允许从网络访问", zh-TW = "Web UI 允許從網路存取" }
help = { en = "Off: only through the desk. The web UI's Host and cross-site request checks are off so the desk can show it: turn this on only on a trusted network. The peer port below is always open to the network.", zh = "关闭时只能通过桌面访问。为了能在桌面中显示，Web 界面的 Host 校验和跨站请求校验已关闭：只在可信网络中开启。下方的对等端口始终对网络开放。", zh-TW = "關閉時只能透過桌面存取。為了能在桌面中顯示，Web 介面的 Host 檢查與跨站請求檢查已關閉：只在可信網路中開啟。下方的對等連接埠一律對網路開放。" }
on = { QBITTORRENT_BIND = "0.0.0.0" }
off = { QBITTORRENT_BIND = "127.0.0.1" }

# Peers connect to this port for torrent data, over TCP and UDP. The image reads
# TORRENTING_PORT and listens on the same number, so the announced port is reachable.
[[settings]]
key = "peer"
type = "port"
env = "TORRENTING_PORT"
default = 6881
protocol = "both"
label = { en = "Peer port (TCP and UDP)", zh = "对等端口（TCP 和 UDP）", zh-TW = "對等連接埠（TCP 與 UDP）" }
help = { en = "Other BitTorrent peers connect here. Forward it on your router for faster downloads.", zh = "其他 BitTorrent 对等端点通过此端口连接。在路由器上转发此端口可提高下载速度。", zh-TW = "其他 BitTorrent 對等端點透過此連接埠連線。在路由器上轉送此連接埠可提高下載速度。" }
