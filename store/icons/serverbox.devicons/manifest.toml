id = "serverbox.devicons"
name = "Devicons"
kind = "icons"

# Icon packs are schema 4.
[schema]
min = 4
max = 4

# Files-window icons only: the theme in use keeps its tabs and navigation.
[icons.images]
"file.dir" = "icons/file_dir.svg"
"file.link" = "icons/file_link.svg"
"file.default" = "icons/file_default.svg"
"file.conf" = "icons/file_conf.svg"
"file.c" = "icons/file_c.svg"
"file.cpp" = "icons/file_cpp.svg"
"file.css" = "icons/file_css.svg"
"file.dart" = "icons/file_dart.svg"
"file.dockerfile" = "icons/file_dockerfile.svg"
"file.erl" = "icons/file_erl.svg"
"file.ex" = "icons/file_ex.svg"
"file.gitignore" = "icons/file_gitignore.svg"
"file.go" = "icons/file_go.svg"
"file.graphql" = "icons/file_graphql.svg"
"file.html" = "icons/file_html.svg"
"file.java" = "icons/file_java.svg"
"file.js" = "icons/file_js.svg"
"file.json" = "icons/file_json.svg"
"file.jsx" = "icons/file_jsx.svg"
"file.kt" = "icons/file_kt.svg"
"file.lua" = "icons/file_lua.svg"
"file.md" = "icons/file_md.svg"
"file.php" = "icons/file_php.svg"
"file.pl" = "icons/file_pl.svg"
"file.py" = "icons/file_py.svg"
"file.rb" = "icons/file_rb.svg"
"file.rs" = "icons/file_rs.svg"
"file.sass" = "icons/file_sass.svg"
"file.scss" = "icons/file_scss.svg"
"file.sh" = "icons/file_sh.svg"
"file.swift" = "icons/file_swift.svg"
"file.ts" = "icons/file_ts.svg"
"file.tsx" = "icons/file_tsx.svg"
"file.vue" = "icons/file_vue.svg"
"file.xml" = "icons/file_xml.svg"
"file.yml" = "icons/file_yml.svg"

# The logos keep their own fills; the folder and link follow the theme.
[icons.colors]
"file.dir" = "tertiary"
"file.link" = "primary"
