# Advisories `cargo audit` reports that are accepted, each with why. One not
# listed here still fails the audit.
[advisories]
ignore = [
  # TODO: remove once `rsa` has a release that fixes it — none does, 0.9 or
  # the 0.10 candidates.
  #
  # rsa: Marvin attack (non-constant-time private-key operations). Three
  # crates bring it in:
  # - jsonwebtoken (monitor): tokens are HS256 (`monitor/src/api/auth.rs`),
  #   so its RSA code is linked and never run.
  # - picky through sspi (RDP): CredSSP only uses public keys. A private RSA
  #   key is used for smart-card logon alone, which is not built in
  #   (`ironrdp-connector`'s `scard` feature is off).
  # - russh (monitor's SSH client): signs with the user's RSA key when that is
  #   the key configured. This is exposed: the server being signed in to
  #   times one signature per connection. Accepted because no fixed `rsa`
  #   exists and dropping RSA keys would lock out whoever has only one. The
  #   app's own SSH signs with pointycastle, not this crate
  #   (`crates/sbm_ffi/CLAUDE.md`).
  "RUSTSEC-2023-0071",
  # TODO: remove once elliptic-curve moves off crypto-bigint 0.5, which has
  # no fixed release (the fix is 0.7.6).
  #
  # crypto-bigint 0.5: timing variability in operations meant to be constant
  # time. Only jsonwebtoken (monitor) brings it in, through p256/p384 for
  # ES256/ES384. Tokens are HS256 both ways (`monitor/src/api/auth.rs`: the
  # default header, `Validation::new(Algorithm::HS256)` and a secret key), so
  # the EC code is linked and never run, whatever token arrives.
  "RUSTSEC-2026-0387",
]
