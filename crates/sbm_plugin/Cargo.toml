[package]
name = "sbm_plugin"
version = "0.1.0"
edition = "2024"
description = "ServerBox plugin host: QuickJS, the `sb` interface, and the permission checks around it"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# quickjs-ng through rquickjs. An interpreter, which is what iOS allows, and a
# JS engine, which is what removes the build step for plugin authors. See
# PLUGINS.md section 3.
rquickjs = { version = "0.12", features = ["either"] }
