[package]
name = "sbm_lkc"
version = "0.1.0"
edition = "2024"
description = "LK Cloud for the monitor agent: device-code sign-in at auth.lolli.tech and the homebase account; the app's client is fl_lib's LkcClient"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", default-features = false, features = ["sync", "time"] }
# `rustls-no-provider`: the ring provider is passed where the client is built,
# so the tree keeps one crypto implementation (see sbm_redfish).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
