[package]
name = "sbm_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "sbm_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
aes = "0.9"
cbc = "0.2"
ctr = "0.10"
flutter_rust_bridge = "=2.13.0-beta.6"
hmac = "0.13"
md-5 = "0.11"
sbm_parser = { path = "../sbm_parser" }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
