[package]
name = "sbm_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "sbm_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
aes = "0.9"
bcrypt-pbkdf = "0.11"
cbc = "0.2"
ctr = "0.10"
ed25519-dalek = "3"
flutter_rust_bridge = "=2.13.0"
hmac = "0.13"
# Upstream IronRDP's main with ServerBox's few changes (lollipopkit/IronRDP,
# branch `serverbox`), every crate of it: no release to wait for.
ironrdp = { path = "../../third_party/ironrdp/crates/ironrdp", default-features = false, features = ["client", "client-clipboard", "cliprdr", "core", "displaycontrol", "graphics", "input", "pdu", "rustls-ring", "session"] }
# Its certificate-validation types, which the meta crate does not re-export.
ironrdp-tls = { path = "../../third_party/ironrdp/crates/ironrdp-tls", features = ["rustls-ring"] }
jpeg-decoder = "0.3"
md-5 = "0.11"
p256 = "0.14"
p384 = "0.14"
p521 = "0.14"
sbm_parser = { path = "../sbm_parser" }
sbm_virt = { path = "../sbm_virt" }
sbm_redfish = { path = "../sbm_redfish" }
serde = "1.0"
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
smallvec = "1.15"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vnc-rs = "=0.6.0"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
x509-cert = { version = "0.3", features = ["std"], default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
