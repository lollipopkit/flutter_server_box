# The theme catalog: which repositories the app's theme store offers.
#
# One entry per repository, and no theme and no version anywhere in this file:
# a theme is published as a release in its author's own repository, and that is
# where its versions live. Adding one is a pull request that adds a single
# `[[repo]]` table below.
#
# The app ships a copy of this file and reads it over HTTPS from this
# repository, so a new entry reaches devices without an app release.

schema = 1
name = "ServerBox themes"

# The official repository: `store/` in this repository, served as a tarball by
# the website build, so the app downloads the store and not this whole tree. A
# third party publishes in their own repository and adds a line here.
[[repo]]
url = "https://serverbox.lollipopkit.com/store.tar.gz"
