[package]
name = "server_box_monitor"
version = "0.1.0"
edition = "2024"

[lib]
name = "server_box_monitor"
path = "src/lib.rs"

[dependencies]
# Web framework
ntex = { version = "2", features = ["tokio"] }
ntex-files = "2.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "migrate",
] }

# Authentication
jsonwebtoken = "9.3"
bcrypt = "0.15"

# Configuration
dotenvy = "0.15"

# HTTP client for push notifications
reqwest = { version = "0.12", features = ["json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Configuration validation
regex = "1.10"

# URL encoding
percent-encoding = "2.3"

# CLI argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

[dev-dependencies]
tokio-test = "0.4"
