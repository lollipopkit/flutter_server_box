plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    System.err.printf(" [!] key.properties not found in %s (%s). \n", rootProject, rootProject.file('.'))
}

def releaseStoreFilePath = keystoreProperties['storeFile']?.toString()?.trim()
def releaseStorePassword = keystoreProperties['storePassword']?.toString()?.trim()
def releaseKeyAlias = keystoreProperties['keyAlias']?.toString()?.trim()
def releaseKeyPassword = keystoreProperties['keyPassword']?.toString()?.trim()

def hasReleaseSigning =
    releaseStoreFilePath &&
    file(releaseStoreFilePath).exists() &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

def allowDebugReleaseSigning = project.findProperty('allowDebugReleaseSigning') == 'true'
def allowUnsignedRelease = project.findProperty('allowUnsignedRelease') == 'true'
def requestedTaskNames = gradle.startParameter.taskNames
    .findAll {
        !it.contains(':') ||
        (it.startsWith(':') && it.indexOf(':', 1) == -1) ||
        it.startsWith("${project.name}:") ||
        it.startsWith("${project.path}:") ||
        it.startsWith(":${project.name}:")
    }
    .collect {
        def normalizedTaskName =
            (it.startsWith("${project.name}:") ||
                it.startsWith("${project.path}:") ||
                it.startsWith(":${project.name}:"))
                ? it.substring(it.lastIndexOf(':') + 1)
                : it.startsWith(':') ? it.substring(1) : it
        normalizedTaskName.toLowerCase()
    }
def aggregateSigningTasks = ['assemble', 'build', 'bundle', 'install']
def requiresReleaseSigning = requestedTaskNames.any {
    aggregateSigningTasks.contains(it) ||
    it == 'release' ||
    (it.startsWith('assemble') && it.contains('release')) ||
    (it.startsWith('bundle') && it.contains('release')) ||
    (it.startsWith('install') && it.contains('release')) ||
    (it.startsWith('build') && it.contains('release'))
}

if (requiresReleaseSigning && !hasReleaseSigning) {
    if (allowDebugReleaseSigning) {
        System.err.printf(" [!] Release signing is unavailable. Falling back to debug signing because -PallowDebugReleaseSigning=true was provided. \n")
    } else if (allowUnsignedRelease) {
        System.err.printf(" [!] Release signing is intentionally disabled for a reproducible/F-Droid build. \n")
    } else {
        throw new GradleException(
            'Release signing is not configured. Add key.properties with a valid storeFile, ' +
            'build with -PallowDebugReleaseSigning=true for local verification, ' +
            'or set -PallowUnsignedRelease=true for a reproducible/F-Droid build.'
        )
    }
}

def pinnedNdkVersion = rootProject.file('ndk-version.txt').text.trim()
def pinnedCompileSdkVersion = rootProject.file('compile-sdk-version.txt').text.trim().toInteger()
def pinnedBuildToolsVersion = rootProject.file('build-tools-version.txt').text.trim()

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "tech.lolli.toolbox"
    compileSdk pinnedCompileSdkVersion
    buildToolsVersion pinnedBuildToolsVersion
    // One version for Gradle native assets and scripts/build-proot-android.sh.
    // A runner's "latest" NDK is not a reproducible build input.
    ndkVersion pinnedNdkVersion

    packaging {
        jniLibs {
            // Extracted rather than mapped out of the APK. A helper binary can
            // only be executed as a file, and with minSdk >= 23 nothing is
            // extracted by default — `nativeLibraryDir` does not exist and
            // there is nowhere for one to be. This is what proot needs; see
            // scripts/build-proot-android.sh.
            //
            // The cost is a larger install: the libraries are stored twice,
            // once in the APK and once unpacked. The download is smaller
            // rather than larger, which is the opposite of what it sounds
            // like — extracted libraries are stored compressed, mapped ones
            // cannot be. Measured on the arm64 release APK: 25.5 MB with
            // this on, 47.8 MB with it off.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        // flutter_local_notifications uses java.time below API 26.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Per module since AGP 9, which dropped the project-wide defaults.
    // BuildConfig for `ImpellerCompatibility`; resValues for the per-build-type
    // `app_name` set in the root build.gradle.
    buildFeatures {
        buildConfig = true
        resValues = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        applicationId "tech.lolli.toolbox"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        ndk {
            if(!splits.abi.enable) { // abiFilters cannot be present when splits abi filters are set
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }

        }
    }

    signingConfigs {
        release {
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            storeFile releaseStoreFilePath ? file(releaseStoreFilePath) : null
            storePassword releaseStorePassword
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                signingConfig signingConfigs.debug
            }
            // With allowUnsignedRelease no signingConfig is assigned. F-Droid
            // and the reproducibility workflow compare the unsigned APK.
            minifyEnabled true
            // `-optimize`: AGP 9 refuses the unoptimized default file.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Native crashes reach us as a tombstone full of addresses. Without
            // symbols kept somewhere, `crash_native` is as far as a report can
            // get -- see NativeExitReport.
            //
            // SYMBOL_TABLE rather than FULL: function names are what resolve a
            // tombstone, and DWARF would multiply the archive's size for line
            // numbers no crash report here carries anyway.
            //
            // Here rather than in defaultConfig, so `flutter run` does not pay
            // for extraction nothing consumes. This does not grow the APK
            // either: AGP extracts the symbols and strips the library on its
            // way in, so what users download is the same stripped .so as
            // before -- `Cargo.toml` stops stripping `sbm_ffi` precisely so
            // there is something left here to extract.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }

        debug {
            // No applicationIdSuffix or resValue here
        }

        profile {
            // No applicationIdSuffix or resValue here
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // JVM unit tests only (`./gradlew :app:testDebugUnitTest`); nothing here
    // reaches the APK.
    testImplementation 'junit:junit:4.13.2'
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
import com.android.build.OutputFile
// Through the legacy variant API on purpose, and it has to stay that way until
// Flutter's own Gradle plugin moves: it sets `versionCodeOverride` on the same
// outputs (`<abi> * 1000 + <build>`), and only a later write of the same kind
// replaces it. A value set through `androidComponents` is overwritten.
// TODO: move to `androidComponents` with flutter/flutter#166550.
android.applicationVariants.all { variant ->
  variant.outputs.each { output ->
    def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
    if (abiVersionCode != null) {
      output.versionCodeOverride = variant.versionCode * 100 + abiVersionCode
    }
  }
}
