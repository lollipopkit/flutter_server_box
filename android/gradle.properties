org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Off. Jetifier rewrites the old support library into AndroidX, and nothing
# here uses the old one — it was rewriting Flutter's own engine artifacts, which
# is where the build ran out of heap. Deprecated by Google, and a no-op for a
# project that is AndroidX throughout.
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
