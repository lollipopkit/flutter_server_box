org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Build speed. R8 on this app's release build thrashes the GC at 2 GB, and the
# per-ABI CI runners have 16 GB. Parallel projects lets the plugin modules
# compile side by side; the build cache reuses task outputs across `flutter
# clean`s and branch switches (outputs are the same bytes either way, so the
# reproducible F-Droid build is unaffected). The configuration cache is left
# off: `app/build.gradle` reads files and the requested task names while it is
# configured, and Flutter's Gradle plugin does not support it yet.
org.gradle.parallel=true
org.gradle.caching=true
# AGP 9's built-in Kotlin and new DSL, both off. Flutter plugins still apply
# `kotlin-android`, which fails the whole build once built-in Kotlin is on, and
# that plugin does not work with the new DSL. Both switches go away in AGP 10.
# TODO: turn both on and drop `kotlin-android` from app/build.gradle once the
# plugins have migrated (flutter/flutter#181383), and once Flutter's own Gradle
# plugin no longer needs `applicationVariants` (flutter/flutter#166550).
android.builtInKotlin=false
android.newDsl=false
