[package]
name = "server_box_monitor"
version = "0.1.3"
edition = "2024"

[lib]
name = "server_box_monitor"
path = "src/lib.rs"

[dependencies]
# Shared status parser (monorepo-wide)
sbm_parser = { path = "../crates/sbm_parser" }
# Native (syscall/procfs) status sampling for monitor's own local collection
# path (never used by the SSH-based app) — see monitoring.rs::collect_metrics
sbm_native = { path = "../crates/sbm_native" }

# Web framework
ntex = { version = "3", features = ["tokio", "rustls"] }
ntex-files = "3.2"

# TLS (ring instead of aws-lc: no cmake/assembly dependency for static musl builds)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "chrono",
    "migrate",
] }

# Authentication
# rust_crypto instead of aws_lc_rs: pure Rust, no cmake/assembly dependency for static musl builds
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"
# sha2 0.11 returns a `hybrid_array::Array`, which has no `LowerHex` — hence hex
sha2 = "0.11"
hex = "0.4"

# Configuration
dotenvy = "0.15"

# Random credential generation (JWT secret / initial admin password) and no-echo password input
getrandom = "0.4"
rpassword = "7"

# HTTP client for push notifications
# rustls instead of native-tls: consistent with sqlx, static musl builds without OpenSSL.
#
# `rustls-no-provider` and not `rustls`, which is defined as
# `__rustls-aws-lc-rs` and pulls aws-lc-sys — a second, complete crypto
# implementation beside the `ring` everything else here uses, and a cmake
# build script in front of the musl targets. The provider it no longer brings
# is installed once in `monitoring::push::http_client`; without that, building
# the client panics inside reqwest rather than failing as a push error, which
# `monitoring::push`'s webhook tests hold.
#
# `form` for the PVE ticket request, which is form-encoded — PVE's login is the
# one endpoint here that is not JSON. `serde_urlencoded` is already in the tree
# through ntex, so the feature adds no crate.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider", "charset", "http2", "stream"] }

# SSH client for the browser terminal. `ring` rather than the default
# aws-lc-rs, matching the backend rustls and jsonwebtoken are configured with,
# so this adds no second crypto implementation of its own.
#
# `ring` is now the only one in the tree — `cargo tree -i aws-lc-sys` finds
# nothing. It was reqwest that brought the other, and that is fixed above; the
# "no cmake for musl" intent these features are chosen for is achieved rather
# than merely stated. Anything added here that wants TLS has to be configured
# the same way, or it comes back.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
# Wipes SSH credentials from memory once they have been used
zeroize = "1"

# Local PTY for the passwordless terminal (ConPTY on Windows, forkpty
# elsewhere). Only used when remote_access.passwordless_terminal is on; the
# SSH path needs none of this.
portable-pty = "0.9"

# The RDCleanPath PDU the RDP proxy endpoint reads and answers with
# (`api::ws::rdcleanpath`). Pure Rust and one dependency of its own (`der`),
# so it adds no crypto implementation — the TLS session this proxy opens to
# the RDP server is rustls, below. Pinned rather than floating: master has
# moved to `der` 0.8 and MSRV 1.94, and this repo builds on 1.89.
ironrdp-rdcleanpath = "=0.2.2"
# TLS *client* for that proxy. The client in the browser does not do TLS — the
# relay terminates it and hands the operator a plaintext RDP stream — so this
# is where the server's certificate chain is observed and sent on.
# `ring` for the reason everything else here uses it: no cmake, so the static
# musl builds work.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration validation
regex = "1.13"

# URL encoding
percent-encoding = "2.3"

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }
# get_server_name() falls back to the real OS hostname (see config.rs)
hostname = "0.4.2"
async-stream = "0.3.6"
futures = "0.3.34"
# Advisory process-wide lock for custom-command directory replacements.
fs2 = "0.4"

# Reading the user's login shell out of the passwd database. `$SHELL` is no
# substitute for a service: it reports whatever launched the agent, not what
# the user configured.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
# Self-signed certificates for the fake RDP server in `tests/rdp_ws.rs`, which
# is what the proxy's TLS handshake is asserted to carry back. `ring` rather
# than the default `aws_lc_rs`: dev-only, but a second crypto implementation in
# the tree is a second thing to build.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
