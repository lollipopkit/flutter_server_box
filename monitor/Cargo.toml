[package]
name = "server_box_monitor"
version = "0.1.0"
edition = "2024"

[lib]
name = "server_box_monitor"
path = "src/lib.rs"

[dependencies]
# Shared status parser (monorepo-wide)
sbm_parser = { path = "../crates/sbm_parser" }
# Native (syscall/procfs) status sampling for monitor's own local collection
# path (never used by the SSH-based app) — see monitoring.rs::collect_metrics
sbm_native = { path = "../crates/sbm_native" }

# Web framework
ntex = { version = "3", features = ["tokio", "rustls"] }
ntex-files = "3.2"

# TLS (ring instead of aws-lc: no cmake/assembly dependency for static musl builds)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "chrono",
    "migrate",
] }

# Authentication
# rust_crypto instead of aws_lc_rs: pure Rust, no cmake/assembly dependency for static musl builds
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"

# Configuration
dotenvy = "0.15"

# Random credential generation (JWT secret / initial admin password) and no-echo password input
getrandom = "0.3"
rpassword = "7"

# HTTP client for push notifications
# rustls instead of native-tls: consistent with sqlx, static musl builds without OpenSSL
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Rate limiting
governor = "0.10"
nonzero_ext = "0.3"

# Configuration validation
regex = "1.13"

# URL encoding
percent-encoding = "2.3"

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }
# get_server_name() falls back to the real OS hostname (see config.rs)
hostname = "0.4.2"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
strip = true
