[package]
name = "server_box_monitor"
version = "0.1.0"
edition = "2024"

[lib]
name = "server_box_monitor"
path = "src/lib.rs"

[dependencies]
# Shared status parser (monorepo-wide)
sbm_parser = { path = "../crates/sbm_parser" }
# Native (syscall/procfs) status sampling for monitor's own local collection
# path (never used by the SSH-based app) — see monitoring.rs::collect_metrics
sbm_native = { path = "../crates/sbm_native" }

# Web framework
ntex = { version = "3", features = ["tokio", "rustls"] }
ntex-files = "3.2"

# TLS (ring instead of aws-lc: no cmake/assembly dependency for static musl builds)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "chrono",
    "migrate",
] }

# Authentication
# rust_crypto instead of aws_lc_rs: pure Rust, no cmake/assembly dependency for static musl builds
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"
sha2 = "0.10"

# Configuration
dotenvy = "0.15"

# Random credential generation (JWT secret / initial admin password) and no-echo password input
getrandom = "0.4"
rpassword = "7"

# HTTP client for push notifications
# rustls instead of native-tls: consistent with sqlx, static musl builds without OpenSSL
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "stream"] }

# SSH client for the browser terminal. `ring` rather than the default
# aws-lc-rs, matching the backend rustls and jsonwebtoken are configured with,
# so this adds no second crypto implementation of its own.
#
# NOTE: it does not follow that the build is free of aws-lc. `reqwest`'s
# `rustls` feature is defined as `__rustls-aws-lc-rs`, so aws-lc-sys and its
# cmake build script come in regardless of what the direct rustls dependency
# asks for — the "no cmake for musl" intent above is currently not achieved.
# Fixing it takes two steps, not one: switch reqwest to `rustls-no-provider`
# *and* install a process-level provider at startup, since without that the
# push client panics on its first HTTPS request (verified: it drops aws-lc and
# cmake from the tree, and fails all five push tests until the provider is
# installed). Left alone here as it belongs to the push path, not this one.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
# Wipes SSH credentials from memory once they have been used
zeroize = "1"

# Local PTY for the passwordless terminal (ConPTY on Windows, forkpty
# elsewhere). Only used when remote_access.passwordless_terminal is on; the
# SSH path needs none of this.
portable-pty = "0.9"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration validation
regex = "1.13"

# URL encoding
percent-encoding = "2.3"

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }
# get_server_name() falls back to the real OS hostname (see config.rs)
hostname = "0.4.2"
async-stream = "0.3.6"
futures = "0.3.34"

# Reading the user's login shell out of the passwd database. `$SHELL` is no
# substitute for a service: it reports whatever launched the agent, not what
# the user configured.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
