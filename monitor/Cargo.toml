[package]
name = "server_box_monitor"
version = "0.2.0"
edition = "2024"

[lib]
name = "server_box_monitor"
path = "src/lib.rs"

[dependencies]
# Shared status parser (monorepo-wide)
sbm_parser = { path = "../crates/sbm_parser" }
sbm_theme = { path = "../crates/sbm_theme" }
sbm_redfish = { path = "../crates/sbm_redfish" }
sbm_virt = { path = "../crates/sbm_virt" }
# Native (syscall/procfs) status sampling for monitor's own local collection
# path (never used by the SSH-based app) — see monitoring.rs::collect_metrics
sbm_native = { path = "../crates/sbm_native" }

# Web framework
ntex = { version = "3", features = ["tokio", "rustls"] }
ntex-files = "3.2"

# TLS (ring instead of aws-lc: no cmake/assembly dependency for static musl builds)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# The panel's RDP sessions (`api::ws::rdcleanpath`): the RDCleanPath PDU the
# browser's IronRDP client opens with, and the TLS client the agent uses to
# reach the RDP server on its behalf (the browser cannot do RDP's TLS). Pinned
# to the protocol version `@devolutions/iron-remote-desktop-rdp` 0.7 speaks.
ironrdp-rdcleanpath = "=0.2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "sqlite",
    "chrono",
    "migrate",
] }

# Authentication
# rust_crypto instead of aws_lc_rs: pure Rust, no cmake/assembly dependency for static musl builds
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"
# sha2 0.11 returns a `hybrid_array::Array`, which has no `LowerHex` — hence hex
sha2 = "0.11"

# Desk app packages (`api::apps`): a gzipped tar, read entry by entry with
# every size bounded while it is read.
tar = { version = "0.4", default-features = false }
flate2 = "1"
# Launch tickets for their UI (HMAC); the crypto already in the tree.
ring = "0.17"
# Desk app backends (`api::app_runtime`): an interpreter, so no JIT and no
# executable memory in the agent; fuel bounds every call.
# `portable-dispatch`: a loop, not tail calls, so no build profile can turn
# a long-running guest into a stack overflow.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }
base64 = "0.22"
hex = "0.4"

# Configuration
dotenvy = "0.15"

# Random credential generation (JWT secret / initial admin password) and no-echo password input
getrandom = "0.4"
rpassword = "7"

# HTTP client for push notifications
# rustls instead of native-tls: consistent with sqlx, static musl builds without OpenSSL.
#
# `rustls-no-provider` and not `rustls`, which is defined as
# `__rustls-aws-lc-rs` and pulls aws-lc-sys — a second, complete crypto
# implementation beside the `ring` everything else here uses, and a cmake
# build script in front of the musl targets. The provider it no longer brings
# is installed once in `monitoring::push::http_client`; without that, building
# the client panics inside reqwest rather than failing as a push error, which
# `monitoring::push`'s webhook tests hold.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2", "stream"] }

# Local PTY for the terminal (ConPTY on Windows, forkpty elsewhere).
portable-pty = "0.9"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration validation
regex = "1.13"

# URL encoding
percent-encoding = "2.3"

# CLI argument parsing
clap = { version = "4.6", features = ["derive", "env"] }
# get_server_name() falls back to the real OS hostname (see config.rs)
hostname = "0.4.2"
async-stream = "0.3.6"
futures = "0.3.34"
url = "2"
# Advisory process-wide lock for custom-command directory replacements.
fs2 = "0.4"

# Reading the user's login shell out of the passwd database. `$SHELL` is no
# substitute for a service: it reports whatever launched the agent, not what
# the user configured.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Building theme packages in `tests/desk_themes.rs`.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# Test modules for the app runtime, written as text.
wat = "1"
tempfile = "3.27.0"
# Self-signed certificates for the fake RDP server in `tests/rdp_ws.rs`.
# `ring`, so the tree keeps one crypto implementation.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
