# ServerBox Monitor Configuration
# TOML format configuration file example

# Database configuration
database_url = "sqlite:serverbox_monitor.db"

# JWT secret for authentication (optional).
# Omit to auto-generate a random secret on first start,
# persisted next to the database as jwt.secret (0600).
# If set explicitly, it must be at least 32 characters.
# jwt_secret = ""

# Server configuration
[server]
host = "0.0.0.0"
port = 3770
# Origins allowed to call the API cross-origin, e.g. a panel hosted on
# Cloudflare Pages. Empty (default) = same-origin only.
# cors_allowed_origins = ["https://panel.example.pages.dev"]

# Optional TLS configuration
# [server.tls]
# cert_path = "/path/to/cert.pem"
# key_path = "/path/to/key.pem"

# WebSocket access to this machine's SSH daemon. Both switches are off by
# default; turning either on exposes shell access through this agent's HTTP
# surface, so it is deliberately a config-file decision and cannot be changed
# from the panel's settings page.
#
# This section is never required — omit it entirely and both stay off.
[remote_access]
# The only address either feature connects to. Not selectable by clients: the
# tunnel takes no target parameter at all, which is what stops it from being
# usable to reach other hosts on this agent's network. To reach another
# machine, configure it in the app with this one as its jump server, so that
# hop is authorised by SSH rather than by this agent.
ssh_addr = "127.0.0.1:22"

# Lets the app reach this machine's SSH over the same HTTPS endpoint it
# already polls, for servers whose SSH port isn't reachable directly. What
# travels through it is the SSH protocol itself, still end-to-end encrypted
# between app and sshd, with the app verifying the host key — this agent
# only moves bytes and cannot read the session.
tunnel_enabled = false

# In-browser terminal in the panel. The agent acts as an SSH client to
# `ssh_addr`, so a session has exactly the privileges of the SSH account the
# browser authenticates as — the panel password alone grants no shell.
terminal_enabled = false

# How long a terminal session survives the browser disconnecting, so a laptop
# that sleeps or a phone that changes network reattaches to the same shell.
# terminal_detached_timeout_secs = 300

# Open a shell straight from a panel login, with no SSH credentials at all.
# Unset follows the platform: on for Linux, off for macOS and Windows.
#
# This makes your panel password equivalent to a shell as whatever account the
# agent runs as — which is why install.sh installs a *user* service by default.
# If you run the agent as root, turn this off. The SSH login stays available
# alongside it either way, for anyone who wants sshd's authentication, logging
# and second factor instead.
#
# Also settable with SBM_PASSWORDLESS_TERMINAL=0/1 (env wins over this file),
# and the panel can turn it off — but never on — from its first-run prompt.
# passwordless_terminal = false

# Serve the terminal on a plaintext listener. Off by default because the
# terminal's first message carries an SSH password and everything after it is
# cleartext output. Not needed when TLS is configured above, nor when a proxy
# on this same host terminates TLS (loopback traffic counts as secure).
# The tunnel is unaffected by this setting.
# allow_insecure = false

# Capacity limits. Leave unset to size them from this machine's physical
# memory; the resolved values are logged once at startup.
# tunnel_max_conns = 8
# terminal_max_sessions = 8
# terminal_scrollback_bytes = 2097152

# Monitoring configuration
[monitoring]
interval_seconds = 7

# How often (seconds) to run the extended status script, which additionally
# collects battery/sensors/SMART/AMD-GPU data — the only fields that still
# need CLI tools (smartctl/sensors/amd-smi) after monitor's native collection
# cutover; core fields (cpu/mem/disk/net/uptime/...) no longer depend on this
# at all. Values are cached and carried forward between extended collections.
# Omit (or leave unset) to default to interval_seconds — i.e. the extended
# script runs every cycle. Set it higher if smartctl-class latency on every
# cycle isn't acceptable for your disks.
# extended_interval_secs = 30

# Data retention and cleanup settings
[monitoring.data_retention]
# How long to keep system metrics (in days)
metrics_days = 30

# How long to keep alert records (in days)  
alerts_days = 90

# How often to run cleanup (in hours)
cleanup_interval_hours = 24

# Hard cap on the SQLite file size (MB); oldest time-series rows are dropped
# until the database fits. 0 disables the cap.
max_db_size_mb = 256

# Monitoring rules
[[monitoring.rules]]
name = "High CPU Usage"
monitor_type = "cpu"
threshold = ">=77%"
matcher = "cpu"

[[monitoring.rules]]
name = "High Memory Usage"
monitor_type = "memory"
threshold = ">=85%"
matcher = "memory"

[[monitoring.rules]]
name = "High Disk Usage"
monitor_type = "disk"
threshold = ">=90%"
matcher = "disk"

# Push notification configurations
[[push]]
name = "webhook"
push_type = "webhook"
url = "http://localhost:5700"
method = "POST"

[push.headers]
"Content-Type" = "application/json"

[push.body_template]
message = "Server {{name}}: {{message}}"

[[push]]
name = "serverchan"
push_type = "serverchan"
sc_key = ""
title = "ServerBox Monitor"
desp = "{{message}}"

[[push]]
name = "bark"
push_type = "bark"
server = "https://api.day.app"
key = ""
title = "ServerBox Monitor"
body = "{{message}}"
level = "active"

[[push]]
name = "ios"
push_type = "ios"
token = ""
title = "ServerBox Monitor"
content = "{{message}}"
body_regex = ".*"
code = 200