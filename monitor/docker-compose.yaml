services:
  server-box-monitor:
    build:
      context: ..
      dockerfile: monitor/Dockerfile
    container_name: server-box-monitor
    ports:
      - "3770:3770"
    environment:
      - SBM_HOST=0.0.0.0
      - SBM_PORT=3770
      - DATABASE_URL=sqlite:/app/data/serverbox_monitor.db
      # JWT_SECRET 可选:未设置时首启自动生成并持久化到 /app/data/jwt.secret
      - JWT_SECRET
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3770/api/v1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  default:
    name: server-box-monitor