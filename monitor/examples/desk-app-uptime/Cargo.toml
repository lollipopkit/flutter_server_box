[package]
name = "desk-app-uptime"
version = "1.0.0"
edition = "2024"
publish = false

# Built on its own, for wasm32-wasip2; not part of the workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
